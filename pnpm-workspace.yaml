packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  esbuild: true
  workerd: true
packageExtensions:
  # Upstream bug: @astrojs/mdx@7.0.8's dist/satteri/index.js imports bare
  # `satteri` without declaring it. It resolves by accident under npm/yarn flat
  # hoisting, but not under pnpm's strict layout. pnpm normally papers over this
  # via its default hoist to .pnpm/node_modules, but two satteri versions
  # (0.9.5 and 0.10.5) are in the tree, so pnpm hoists neither and the import
  # fails outright at `astro build`.
  #
  # Declaring it here pins the same range @astrojs/markdown-satteri uses, rather
  # than hoisting an arbitrary one of the two. Remove once @astrojs/mdx > 7.0.8
  # declares its own dependency.
  '@astrojs/mdx':
    dependencies:
      satteri: '^0.10.3'
overrides:
  # GHSA-238p-pmpm-9mq7 is fixed in katex 0.18.2, but `mermaid` 11, `@streamdown/math`,
  # `rehype-katex` and `micromark-extension-math` still ask for `^0.16`. The selector matches
  # only versions below the fix, so the override goes dormant on its own once upstream moves.
  # Delete it once `pnpm why katex` shows nothing asking for a version below 0.18.2 (see
  # vercel/streamdown#655).
  'katex@<0.18.2': 0.18.2
  # GHSA-xjj6-f33q-929c, GHSA-4qv8-2p9j-2685 and GHSA-f72v-6w45-q472 are fixed in
  # undici 7.30.1, but `miniflare` (via `wrangler`) pins 7.29.1 exactly, up to and including
  # 5.20261019.2-beta. The selector matches only vulnerable 7.x versions, so the override goes
  # dormant on its own once miniflare moves. Delete it once `pnpm why undici` shows nothing
  # asking for a 7.x below 7.30.1.
  'undici@>=7.0.0 <7.30.1': 7.30.1
