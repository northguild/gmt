packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  esbuild: true
  workerd: true
overrides:
  # DoS / info-disclosure advisories in dev- and build-time transitives. None of
  # these ship in a published @northguild/* tarball (gmt is dist-only; the linter
  # packages take eslint / typescript-eslint as peers; apps/dox is private). Each
  # target is a bugfix bump within the major the tree already resolves. Re-run
  # `pnpm audit` and prune on every @changesets/cli, eslint, typescript-eslint,
  # tsup, and @astrojs/starlight bump. Advisory refs in the PR description.
  #
  # via gmt-eslint -> eslint / @typescript-eslint -> minimatch
  brace-expansion@<1.1.18: '1.1.18'
  brace-expansion@>=4.0.0 <5.0.9: '5.0.9'
  # via gmt-eslint -> eslint
  '@humanfs/node@<0.16.8': '>=0.16.8'
  # via root @changesets/cli
  js-yaml@>=3.0.0 <3.15.1: '^3.15.1'
  js-yaml@>=4.0.0 <4.3.1: '^4.3.1'
  # via apps/dox -> @astrojs/starlight -> expressive-code
  postcss@<8.5.23: '^8.5.23'
  nanoid@>=3.0.0 <3.3.18: '^3.3.18'
  # via gmt-oxlint -> tsup
  esbuild@<0.28.1: '^0.28.1'
packageExtensions:
  # Upstream bug: @astrojs/mdx@7.0.8's dist/satteri/index.js imports bare
  # `satteri` without declaring it. It resolves by accident under npm/yarn flat
  # hoisting, but not under pnpm's strict layout. pnpm normally papers over this
  # via its default hoist to .pnpm/node_modules, but two satteri versions
  # (0.9.5 and 0.10.5) are in the tree, so pnpm hoists neither and the import
  # fails outright at `astro build`.
  #
  # Declaring it here pins the same range @astrojs/markdown-satteri uses, rather
  # than hoisting an arbitrary one of the two. Remove once @astrojs/mdx > 7.0.8
  # declares its own dependency.
  '@astrojs/mdx':
    dependencies:
      satteri: '^0.10.3'
