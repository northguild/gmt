<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sound audition</title>
    <!--
      DOX-G11 sound audition. A planning tool, not site code: open it from disk
      (file://) in the browser you use, pick one variant per step, and paste the
      picks block from the last step back into the planning session. Every voice
      is synthesised with the Web Audio API; there are no samples and no network
      requests. Each variant's `play` (or `start`, for a loop) uses only the small
      kit at the top of the script, so a chosen variant ports into
      apps/dox/src/lib/sound/voices.ts as it stands. It stays after the story
      closes, as the reference for any voice added or changed later.
    -->
    <style>
      :root {
        --void: #03080c;
        --surface: #061018;
        --surface-2: #0a1a24;
        --ice: #cfeaf2;
        --ice-dim: #98b2be;
        --ice-bright: #f2fcff;
        --cyan: #22d3ee;
        --frost: #bff3fb;
        --line: rgb(34 211 238 / 0.32);
        --line-strong: rgb(34 211 238 / 0.7);
        --glow: 0 0 0.6rem rgb(34 211 238 / 0.45);
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
        --bevel: 0.6rem;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background:
          radial-gradient(
            ellipse at 70% -10%,
            rgb(34 211 238 / 0.08),
            transparent 60%
          ),
          var(--void);
        color: var(--ice);
        font: 1rem/1.5 var(--sans);
        min-block-size: 100dvh;
      }
      main {
        max-inline-size: 62rem;
        margin-inline: auto;
        padding: 1rem;
      }
      .bevel {
        border: 1px solid var(--line);
        border-radius: var(--bevel);
        corner-shape: bevel;
        background: linear-gradient(180deg, var(--surface-2), var(--surface));
      }
      header.top {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.5rem;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1rem;
        margin-block-end: 1rem;
      }
      h1 {
        font: 600 1.05rem/1.2 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0;
      }
      .progress {
        font: 0.85rem var(--mono);
        color: var(--ice-dim);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .master {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        font: 0.8rem var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .master output {
        inline-size: 3.5rem;
        text-align: end;
        font-variant-numeric: tabular-nums;
        color: var(--frost);
      }
      input[type="range"] {
        accent-color: var(--cyan);
        inline-size: 9rem;
      }
      button {
        font: 600 0.8rem var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ice);
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: 0.45rem;
        corner-shape: bevel;
        padding: 0.45rem 0.9rem;
        min-block-size: 2.25rem;
        cursor: pointer;
      }
      button:hover {
        background: var(--surface-2);
        box-shadow: var(--glow);
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 2px;
      }
      button[disabled] {
        opacity: 0.45;
        cursor: default;
        box-shadow: none;
      }
      .step {
        padding: 1rem 1.25rem 1.25rem;
      }
      .step h2 {
        font: 600 1.3rem/1.2 var(--mono);
        margin: 0 0 0.25rem;
        letter-spacing: 0.04em;
      }
      .where {
        color: var(--ice-dim);
        margin: 0 0 1rem;
        font-size: 0.9rem;
      }
      .variants {
        display: grid;
        grid-template-columns: repeat(
          auto-fit,
          minmax(min(100%, 13.5rem), 1fr)
        );
        gap: 0.75rem;
      }
      /* Header mock-ups are wide: one per row. */
      .variants:has([data-mock]) {
        grid-template-columns: 1fr;
      }
      .mock {
        max-inline-size: 30rem;
        margin-block-start: 0.6rem;
      }
      .variant {
        min-inline-size: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto 1fr auto;
        gap: 0.5rem;
        padding: 0.85rem;
        border: 1px solid var(--line);
        border-radius: var(--bevel);
        corner-shape: bevel;
        background: var(--surface);
      }
      /* The pick is a full bevelled border, never a left edge. */
      .variant:has(input[name="pick"]:checked) {
        border-color: var(--cyan);
        box-shadow: var(--glow);
        background: var(--surface-2);
      }
      .variant h3 {
        margin: 0;
        font: 600 0.95rem var(--mono);
        display: flex;
        gap: 0.5rem;
        align-items: baseline;
      }
      .letter {
        color: var(--void);
        background: var(--frost);
        padding: 0 0.4rem;
        border-radius: 0.25rem;
        corner-shape: bevel;
      }
      .variant p {
        margin: 0;
        font-size: 0.85rem;
        color: var(--ice-dim);
      }
      .actions {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        justify-content: space-between;
      }
      .pick {
        display: flex;
        gap: 0.35rem;
        align-items: center;
        font: 0.8rem var(--mono);
        text-transform: uppercase;
        cursor: pointer;
      }
      .pick input {
        accent-color: var(--cyan);
        inline-size: 1rem;
        block-size: 1rem;
      }
      .none {
        margin-block-start: 0.75rem;
      }
      .try {
        margin-block-start: 1rem;
        display: grid;
        gap: 0.35rem;
        font-size: 0.85rem;
        color: var(--ice-dim);
      }
      .try textarea,
      .try input[type="text"] {
        font: 0.9rem var(--mono);
        color: var(--ice);
        background: var(--void);
        border: 1px solid var(--line);
        border-radius: 0.4rem;
        corner-shape: bevel;
        padding: 0.5rem;
        caret-color: var(--cyan);
        inline-size: 100%;
      }
      .zoom-plays {
        display: grid;
        grid-template-columns: repeat(2, auto);
        gap: 0.35rem;
      }
      .zoom-plays button {
        white-space: nowrap;
      }
      .actions:has(.zoom-plays) {
        flex-wrap: wrap;
        row-gap: 0.6rem;
      }
      .zoom-pad {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        block-size: 9rem;
        border: 1px solid var(--line);
        border-radius: var(--bevel);
        corner-shape: bevel;
        background: radial-gradient(
          circle at 50% 50%,
          var(--surface-2),
          var(--void) 70%
        );
        touch-action: none;
      }
      .zoom-pad output {
        font: 1.1rem var(--mono);
        color: var(--ice);
        min-inline-size: 4ch;
        text-align: center;
      }
      nav.pager {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        margin-block-end: 1rem;
      }
      pre.picks {
        font: 0.85rem/1.5 var(--mono);
        background: var(--void);
        border: 1px solid var(--line);
        border-radius: var(--bevel);
        corner-shape: bevel;
        padding: 0.75rem 1rem;
        overflow-x: auto;
        white-space: pre;
      }
      .note {
        font-size: 0.85rem;
        color: var(--ice-dim);
      }

      /* ---- Control mock-ups (step "control") ---- */
      .mock-bar {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        block-size: 3.4rem;
        padding-inline: 0.75rem;
        background: rgb(6 16 24 / 0.92);
        border: 1px solid var(--line);
        border-radius: 0.45rem;
        corner-shape: bevel;
        font: 600 0.85rem var(--mono);
      }
      .mock-bar .brand {
        color: var(--ice);
        white-space: nowrap;
        min-inline-size: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mock-bar > :not(.brand) {
        flex-shrink: 0;
      }
      .mock-bar .brand b {
        color: var(--cyan);
        font-weight: 600;
      }
      .mock-bar .slack {
        flex: 1;
      }
      .chip {
        display: inline-grid;
        place-items: center;
        inline-size: 2.4rem;
        block-size: 2.4rem;
        padding: 0;
        min-block-size: 0;
      }
      .chip svg {
        inline-size: 1.25rem;
        block-size: 1.25rem;
      }
      .chip[aria-pressed="true"] {
        border-color: var(--frost);
        background: var(--surface-2);
      }
      .chip.narrow {
        inline-size: 1.6rem;
      }
      .deck {
        margin-block-start: 0.5rem;
        padding: 0.75rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }
      .sr-only {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      fieldset.dial {
        position: relative;
        border: 0;
        margin: 0;
        padding: 0;
        --knob: 3.1rem;
        --rx: 3.6rem;
        --ry: 2.9rem;
        inline-size: 9rem;
        block-size: 5.6rem;
        user-select: none;
        -webkit-user-select: none;
      }
      fieldset.dial.mini {
        --knob: 2.2rem;
        inline-size: 2.4rem;
        block-size: 2.4rem;
      }
      .knob {
        position: absolute;
        left: 50%;
        bottom: 2.05rem;
        inline-size: var(--knob);
        block-size: var(--knob);
        translate: -50% 50%;
        rotate: var(--angle, -120deg);
        transition: rotate 0.12s ease;
        touch-action: none;
        cursor: grab;
      }
      fieldset.dial.mini .knob {
        bottom: 50%;
      }
      .knob:active {
        cursor: grabbing;
      }
      .knob svg {
        display: block;
        inline-size: 100%;
        block-size: 100%;
        overflow: visible;
      }
      .knob .rim {
        fill: #0b2230;
        stroke: var(--line-strong);
        stroke-width: 2;
      }
      .knob .lip {
        fill: #02060a;
      }
      .knob .face {
        stroke: rgb(207 234 242 / 0.25);
        stroke-width: 1;
      }
      .knob .needle {
        stroke: var(--frost);
        stroke-width: 7;
        stroke-linecap: square;
        filter: drop-shadow(0 0 3px var(--cyan));
      }
      fieldset.dial:has(input:focus-visible) .knob {
        outline: 2px solid var(--cyan);
        outline-offset: 3px;
      }
      .detent {
        position: absolute;
        left: 50%;
        bottom: 2.05rem;
        transform: translate(-50%, 50%)
          translate(calc(var(--x) * var(--rx)), calc(var(--y) * var(--ry)));
        font: 600 0.72rem var(--mono);
        color: var(--ice-dim);
        cursor: pointer;
        padding: 0 0.2rem;
        border-radius: 0.2rem;
        corner-shape: bevel;
        white-space: nowrap;
      }
      .detent:has(input:checked) {
        color: var(--frost);
        background: rgb(34 211 238 / 0.14);
        text-shadow: 0 0 0.4rem var(--cyan);
      }
      .detent:has(input:focus-visible) {
        outline: 2px solid var(--cyan);
      }
      .level-chip {
        display: inline-block;
        inline-size: 3.2rem;
        text-align: center;
        font: 600 0.75rem var(--mono);
        font-variant-numeric: tabular-nums;
        color: var(--frost);
        border: 1px solid var(--line);
        border-radius: 0.3rem;
        corner-shape: bevel;
        padding: 0.1rem 0;
        white-space: nowrap;
      }
      /* The ice lever: a native checkbox (role="switch") under an octagonal plate. */
      .lever {
        display: grid;
        justify-items: center;
        gap: 0.2rem;
        font: 600 0.72rem var(--mono);
        color: var(--ice-dim);
        cursor: pointer;
      }
      .lever .plate {
        position: relative;
        inline-size: 2.3rem;
        block-size: 3.1rem;
        border: 1.5px solid var(--line-strong);
        border-radius: 0.55rem;
        corner-shape: bevel;
        background: linear-gradient(160deg, #12303e, #04121a);
      }
      .lever .nut {
        position: absolute;
        left: 50%;
        top: 50%;
        inline-size: 1.15rem;
        block-size: 1.15rem;
        translate: -50% -50%;
        border: 2px solid var(--line-strong);
        border-radius: 0.3rem;
        corner-shape: bevel;
        background: #02080c;
      }
      .lever .bat {
        position: absolute;
        left: calc(50% - 0.18rem);
        bottom: 50%;
        inline-size: 0.36rem;
        block-size: 1.15rem;
        background: var(--ice-dim);
        transform-origin: 50% 100%;
        rotate: 180deg;
        transition: rotate 0.14s ease;
      }
      .lever .bat::before {
        content: "";
        position: absolute;
        left: 50%;
        top: -0.35rem;
        inline-size: 0.7rem;
        block-size: 0.7rem;
        translate: -50% 0;
        border-radius: 0.18rem;
        corner-shape: bevel;
        background: radial-gradient(
          circle at 35% 30%,
          var(--ice-bright),
          var(--cyan)
        );
      }
      .lever:has(input:checked) .bat {
        rotate: 0deg;
      }
      .lever:has(input:checked) .on,
      .lever:not(:has(input:checked)) .off {
        color: var(--frost);
      }
      .lever:has(input:focus-visible) .plate {
        outline: 2px solid var(--cyan);
        outline-offset: 3px;
      }
      .fader {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .fader input[type="range"] {
        appearance: none;
        inline-size: 7.5rem;
        block-size: 1.5rem;
        background:
          repeating-linear-gradient(
              90deg,
              var(--line-strong) 0 1px,
              transparent 1px calc((100% - 1px) / 11)
            )
            center / 100% 0.5rem no-repeat,
          linear-gradient(var(--surface), var(--surface));
        border: 1px solid var(--line);
        border-radius: 0.3rem;
        corner-shape: bevel;
      }
      .fader input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        inline-size: 0.8rem;
        block-size: 1.4rem;
        background: linear-gradient(90deg, var(--ice-bright), var(--cyan));
        border-radius: 0.2rem;
        corner-shape: bevel;
        box-shadow: var(--glow);
        cursor: grab;
      }
      .fader input[type="range"]::-moz-range-thumb {
        inline-size: 0.8rem;
        block-size: 1.4rem;
        border: 0;
        background: linear-gradient(90deg, var(--ice-bright), var(--cyan));
        border-radius: 0.2rem;
        box-shadow: var(--glow);
      }
      @media (prefers-reduced-motion: reduce) {
        .knob,
        .lever .bat {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="top bevel">
        <h1>DOX-G11 · sound audition</h1>
        <span class="progress" id="progress"></span>
        <label class="master"
          >Master
          <input id="master" type="range" min="0" max="11" step="1" value="6" />
          <output id="master-out" for="master">6</output>
        </label>
        <button type="button" id="stop-all">Stop all</button>
      </header>
      <nav class="pager" aria-label="Steps">
        <button type="button" id="back">Back</button>
        <button type="button" id="next">Next</button>
      </nav>
      <section class="step bevel" id="step" aria-live="polite"></section>
      <p class="note">
        Press a Play button first: the browser starts audio only after a click.
        Your picks are kept in this browser while you work, so a reload loses
        nothing.
      </p>
    </main>

    <script>
      "use strict";

      /* ===================================================================
       * The kit. Every voice below is built only from these helpers, so the
       * helpers plus a chosen variant port into the Dox sound module as-is.
       * All timing reads the audio clock (AudioContext.currentTime), never a
       * wall clock: `t` is a time on that clock.
       * =================================================================== */

      const MAX_GAIN = 0.6;
      const MAX_LEVEL = 11;
      let ctx = null;
      let master = null;
      let level = 6;

      function audio() {
        if (!ctx) {
          ctx = new AudioContext();
          master = ctx.createGain();
          master.gain.value = (level / MAX_LEVEL) * MAX_GAIN;
          /* The safety ceiling: every sample under 0.18 passes unchanged,
             louder ones bend towards 0.25 (−12 dBFS) and never pass it. */
          const shaper = ctx.createWaveShaper();
          const curve = new Float32Array(4097);
          for (let i = 0; i < curve.length; i++) {
            const x = (i / (curve.length - 1)) * 2 - 1;
            const m = Math.abs(x);
            curve[i] =
              Math.sign(x) *
              (m <= 0.18 ? m : 0.18 + 0.07 * Math.tanh((m - 0.18) / 0.07));
          }
          shaper.curve = curve;
          master.connect(shaper).connect(ctx.destination);
        }
        if (ctx.state === "suspended") ctx.resume();
        return ctx;
      }

      function setMasterLevel(next) {
        level = Math.max(0, Math.min(MAX_LEVEL, Math.round(next)));
        if (master && ctx) {
          master.gain.setTargetAtTime(
            (level / MAX_LEVEL) * MAX_GAIN,
            ctx.currentTime,
            0.015,
          );
        }
        for (const listener of levelListeners) listener(level);
      }
      const levelListeners = new Set();

      const hz = (midi) => 440 * 2 ** ((midi - 69) / 12);
      const rand = (lo, hi) => lo + Math.random() * (hi - lo);

      let noiseCache = null;
      /** One second of white noise, shared by every voice. */
      function noiseBuffer(c) {
        if (noiseCache && noiseCache.sampleRate === c.sampleRate)
          return noiseCache;
        const length = c.sampleRate;
        noiseCache = c.createBuffer(1, length, c.sampleRate);
        const data = noiseCache.getChannelData(0);
        for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
        return noiseCache;
      }

      /** A gain envelope: silence, a linear attack, a hold, an exponential release. */
      function envelope(c, t, peak, attack, hold, release) {
        const g = c.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(peak, t + attack);
        g.gain.setValueAtTime(peak, t + attack + hold);
        g.gain.exponentialRampToValueAtTime(
          0.0001,
          t + attack + hold + release,
        );
        return g;
      }

      function biquad(c, type, freq, q) {
        const f = c.createBiquadFilter();
        f.type = type;
        f.frequency.value = freq;
        f.Q.value = q ?? 0.7;
        return f;
      }

      /**
       * One oscillator note. o: { type, freq, to, detune, peak, attack, hold,
       * release, filter: [type, freq, q] }.
       */
      function tone(c, out, t, o) {
        const attack = o.attack ?? 0.004;
        const hold = o.hold ?? 0;
        const end = t + attack + hold + o.release;
        const osc = c.createOscillator();
        osc.type = o.type ?? "sine";
        osc.frequency.setValueAtTime(o.freq, t);
        if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, end);
        if (o.detune) osc.detune.value = o.detune;
        const g = envelope(c, t, o.peak, attack, hold, o.release);
        if (o.filter) {
          const f = biquad(c, o.filter[0], o.filter[1], o.filter[2]);
          osc.connect(f).connect(g);
        } else {
          osc.connect(g);
        }
        g.connect(out);
        osc.start(t);
        osc.stop(end + 0.03);
        return osc;
      }

      /**
       * A burst of filtered noise. o: { type, freq, to, q, peak, attack, hold,
       * decay }. `to` sweeps the filter over the burst.
       */
      function noise(c, out, t, o) {
        const attack = o.attack ?? 0.004;
        const hold = o.hold ?? 0;
        const end = t + attack + hold + o.decay;
        const src = c.createBufferSource();
        src.buffer = noiseBuffer(c);
        src.loop = true;
        const f = biquad(c, o.type ?? "bandpass", o.freq, o.q ?? 1);
        if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, end);
        const g = envelope(c, t, o.peak, attack, hold, o.decay);
        src.connect(f).connect(g).connect(out);
        src.start(t, Math.random() * 0.5);
        src.stop(end + 0.03);
      }

      /**
       * A struck metal or ice bar: inharmonic partials, the higher ones dying
       * first. o: { freq, ratios, peak, decay, attack }.
       */
      function bell(c, out, t, o) {
        o.ratios.forEach((ratio, i) => {
          tone(c, out, t, {
            freq: o.freq * ratio,
            peak: o.peak / (i + 1),
            attack: o.attack ?? 0.002,
            release: o.decay / Math.sqrt(i + 1),
          });
        });
      }

      /** A dark hall: a decaying noise impulse. Returns the send. */
      function hall(c, out, seconds, wet) {
        const length = Math.ceil(c.sampleRate * seconds);
        const impulse = c.createBuffer(2, length, c.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const d = impulse.getChannelData(ch);
          for (let i = 0; i < length; i++)
            d[i] = (Math.random() * 2 - 1) * (1 - i / length) ** 3;
        }
        const verb = c.createConvolver();
        verb.buffer = impulse;
        const g = c.createGain();
        g.gain.value = wet;
        verb
          .connect(biquad(c, "lowpass", 3000))
          .connect(g)
          .connect(out);
        return verb;
      }

      /** A feedback echo. Returns the send. */
      function echo(c, out, seconds, feedback, wet) {
        const input = c.createGain();
        const delay = c.createDelay(2);
        delay.delayTime.value = seconds;
        const loop = c.createGain();
        loop.gain.value = feedback;
        const damp = biquad(c, "lowpass", 3200);
        const g = c.createGain();
        g.gain.value = wet;
        input.connect(delay).connect(damp).connect(loop).connect(delay);
        damp.connect(g).connect(out);
        return input;
      }

      function sharedFx(c, key, build) {
        if (!shared.has(key)) shared.set(key, build(c, master));
        return shared.get(key);
      }
      const space = (c) =>
        sharedFx(c, "hall", (cc, out) => hall(cc, out, 2.6, 0.5));
      const sonarEcho = (c) =>
        sharedFx(c, "echo", (cc, out) => echo(cc, out, 0.19, 0.38, 0.32));

      /**
       * A lookahead scheduler on the audio clock: tops up `fn(time, index)`
       * calls for the next 0.6 s every 150 ms. `gap(index)` is the seconds to
       * the next call. Returns a stop function.
       */
      function scheduler(c, gap, fn) {
        let next = c.currentTime + 0.05;
        let index = 0;
        const tick = () => {
          while (next < c.currentTime + 0.6) {
            fn(next, index);
            next += gap(index);
            index += 1;
          }
        };
        tick();
        const id = setInterval(tick, 150);
        return () => clearInterval(id);
      }

      /**
       * Noise through a short feedback delay (a comb): the delay's
       * resonances ring like a steel tube with no strike, and sweeping the
       * delay moves the ring. The Steel breath's engine, made general.
       * o: { from, to, peak, attack, release, band, feedback, lowpass, wet }.
       */
      function steelComb(c, out, t, o) {
        const end = t + o.attack + o.release;
        const src = c.createBufferSource();
        src.buffer = noiseBuffer(c);
        src.loop = true;
        const pre = biquad(c, "bandpass", o.band ?? 2400, 0.5);
        const env = envelope(c, t, o.peak, o.attack, 0, o.release);
        const delay = c.createDelay(0.05);
        delay.delayTime.setValueAtTime(o.from, t);
        delay.delayTime.exponentialRampToValueAtTime(o.to, end);
        const feedback = c.createGain();
        feedback.gain.value = o.feedback ?? 0.8;
        const colour = biquad(c, "lowpass", o.lowpass ?? 5500);
        src.connect(pre).connect(env).connect(delay);
        delay.connect(feedback).connect(delay);
        delay.connect(colour).connect(out);
        if (o.wet) {
          const wet = c.createGain();
          wet.gain.value = o.wet;
          colour.connect(wet).connect(space(c));
        }
        src.start(t, Math.random() * 0.5);
        src.stop(end + 0.05);
      }

      /* ---- Zoom helpers: a zoom voice is a gesture. `gesture(c, out)` returns
         { step(t, dir, z), end(t) }: `dir` is +1 in, −1 out; `z` is how close
         the camera is, 0 (whole Earth) to 1 (closest). */

      /** A pitch or frequency `z` of the way from `lo` to `hi`, on a log scale. */
      const zoomPitch = (lo, hi, z) => lo * (hi / lo) ** z;

      /** A gesture that plays one short voice per step and holds nothing. */
      function perStep(fn) {
        return (c, out) => ({
          step: (t, dir, z) => fn(c, out, t, dir, z),
          end() {},
        });
      }

      /**
       * A gesture that holds one voice from the first step to `end`: it fades
       * in on the first step, `set(t, z)` glides it on every step, and it fades
       * out after the last. o: { peak, build(c, gain) -> { nodes, set } }.
       */
      function heldGesture(c, out, o) {
        const g = c.createGain();
        g.gain.value = 0;
        g.connect(out);
        const voice = o.build(c, g);
        let started = false;
        return {
          step(t, dir, z) {
            if (!started) {
              started = true;
              voice.set(t, z);
              for (const node of voice.nodes) node.start(t);
              g.gain.setValueAtTime(0, t);
              g.gain.linearRampToValueAtTime(o.peak, t + 0.06);
            } else {
              voice.set(t, z);
            }
          },
          end(t) {
            if (!started) return;
            g.gain.cancelScheduledValues(t);
            g.gain.setTargetAtTime(0, t, 0.08);
            for (const node of voice.nodes) node.stop(t + 0.6);
            setTimeout(
              () => g.disconnect(),
              Math.max(0, (t - c.currentTime + 0.7) * 1000),
            );
          },
        };
      }

        (step) => `#${step.id}` === location.hash,
      );

      const running = new Map(); // "step:variant" -> stop function

      function stopLoop(key) {
        const stop = running.get(key);
        if (!stop) return;
        running.delete(key);
        stop();
      }
      function stopAll() {
        for (const key of [...running.keys()]) stopLoop(key);
        for (const button of document.querySelectorAll(
          "[data-play][aria-pressed='true']",
        )) {
          button.setAttribute("aria-pressed", "false");
          button.textContent = "Play";
        }

      /** Plays a loop on its own bus, which fades in, and fades out on stop. */
      function startLoop(variant, fadeIn) {
        const c = audio();
        const bus = c.createGain();
        bus.gain.setValueAtTime(0, c.currentTime);
        bus.gain.linearRampToValueAtTime(1, c.currentTime + fadeIn);
        bus.connect(master);
        const inner = variant.start(c, bus);
        return () => {
          bus.gain.cancelScheduledValues(c.currentTime);
          bus.gain.setTargetAtTime(0, c.currentTime, 0.25);
          setTimeout(() => {
            inner();
            bus.disconnect();
          }, 1800);
        };
      }

      /** Fires a burst voice as a run: typing, detents or a stream. */
      function playRun(run, variant) {
        const c = audio();
        let t = c.currentTime + 0.03;
        if (run === "detents") {
          for (let i = 0; i < 6; i++) variant.play(c, master, t + i * 0.11);
        } else if (run === "typing") {
          for (let i = 0; i < 11; i++) {
            variant.play(c, master, t);
            t += i === 4 ? 0.28 : rand(0.08, 0.17);
          }
        } else {
          let last = -1;
          const end = t + 2;
          while (t < end) {
            if (t - last >= 0.06) {
              variant.play(c, master, t);
              last = t;
            }
            t += rand(0.03, 0.14);
          }
        }
      }

      /** Plays a zoom voice as `count` wheel steps, in (dir +1) or out (−1). */
      function playZoom(variant, dir, count) {
        const c = audio();
        const t0 = c.currentTime + 0.03;
        const gesture = variant.gesture(c, master);
        let z = dir > 0 ? 0.2 : 0.8;
        for (let i = 0; i < count; i++) {
          gesture.step(t0 + i * 0.075, dir, z);
          z = Math.max(0, Math.min(1, z + dir * 0.08));
        }
        gesture.end(t0 + (count - 1) * 0.075 + 0.12);
      }

              ? `<span class="zoom-plays">${ZOOM_PLAYS.map(
                  ([key, label]) =>
                    `<button type="button" data-zoom="${v.id}:${key}">${label}</button>`,
                ).join("")}</span>`
              : `<button type="button" data-play="${v.id}" aria-pressed="false">Play</button>`;
        const mock =
          step.kind === "control"
            ? `<div class="mock" data-mock="${v.id}"></div>`
            : "";
        return `<article class="variant">
          <h3><span class="letter">${v.id}</span>${v.name}</h3>
          <div><p>${v.desc}</p>${mock}</div>
          <div class="actions">${play}
            <label class="pick"><input type="radio" name="pick" value="${v.id}" ${checked} />Pick ${v.id}</label>
          </div>
        </article>`;
      }

      function render() {
        stopAll();
        progressEl.textContent =
          index < STEPS.length
            ? `Step ${index + 1} of ${STEPS.length}`
            : `Done · ${STEPS.length} steps`;
        backBtn.disabled = index === 0;
        nextBtn.disabled = index >= STEPS.length;
        nextBtn.textContent = index === STEPS.length - 1 ? "Finish" : "Next";
        if (index >= STEPS.length) return renderSummary();
        const step = STEPS[index];
        const noneChecked = picks[step.id] === "none" ? "checked" : "";
        const tryBox =
          step.run === "typing"
            ? '<label class="try">Type here to hear your pick (or A):<input type="text" id="try-type" autocomplete="off" /></label>'
            : step.run === "detents"
              ? '<label class="try">Drag or arrow this slider to hear your pick (or A):<input type="range" id="try-detent" min="0" max="20" value="10" /></label>'
              : step.kind === "zoom"
                ? '<div class="try">Wheel, pinch or use the buttons over this box to zoom with your pick (or A):<div class="zoom-pad" id="try-zoom" tabindex="0" role="group" aria-label="Zoom pad"><button type="button" data-pad="1" aria-label="Zoom in">+</button><output id="try-zoom-level">50%</output><button type="button" data-pad="-1" aria-label="Zoom out">−</button></div></div>'
                : "";
        const none =
          step.kind === "control"
            ? ""
            : `<label class="pick none"><input type="radio" name="pick" value="none" ${noneChecked} />No sound for this event</label>`;
        stepEl.innerHTML = `<h2>${step.title}</h2>
          <p class="where">${step.where}</p>
          <div class="variants">${step.variants.map((v) => variantCard(step, v)).join("")}</div>
          ${none}${tryBox}`;
        wireStep(step);
      }

      function wireStep(step) {
        for (const radio of stepEl.querySelectorAll('input[name="pick"]')) {
          radio.addEventListener("change", () => {
            picks[step.id] = radio.value;
            save();
          });
        }
        for (const button of stepEl.querySelectorAll("[data-play]")) {
          const v = step.variants.find((x) => x.id === button.dataset.play);
          button.addEventListener("click", () => {
            const key = `${step.id}:${v.id}`;
            if (step.kind === "loop") {
              if (running.has(key)) {
                stopLoop(key);
                button.setAttribute("aria-pressed", "false");
                button.textContent = "Play";
                return;
              }
              stopAll();
              running.set(key, startLoop(v, step.id === "aura" ? 3 : 0.3));
              button.setAttribute("aria-pressed", "true");
              button.textContent = "Stop";
            } else if (step.kind === "burst") {
              playRun(step.run, v);
            } else {
              const c = audio();
              v.play(c, master, c.currentTime + 0.01);
            }
          });
        }
        const typing = stepEl.querySelector("#try-type");
        typing?.addEventListener("keydown", (event) => {
          if (event.isComposing || event.repeat) return;
          playPicked("key");
        });
        const slider = stepEl.querySelector("#try-detent");
        slider?.addEventListener("input", () => playPicked("detent"));
        for (const button of stepEl.querySelectorAll("[data-zoom]")) {
          const [vid, key] = button.dataset.zoom.split(":");
          const v = step.variants.find((x) => x.id === vid);
          button.addEventListener("click", () =>
            playZoom(
              v,
              key.startsWith("in") ? 1 : -1,
              key.endsWith("8") ? 8 : 1,
            ),
          );
        }
        const pad = stepEl.querySelector("#try-zoom");
        if (pad) wireZoomPad(pad);
        if (step.kind === "control") mountMocks();
      }

      /**
       * The zoom pad: a wheel or trackpad over it, a pinch (ctrl+wheel), the
       * + and − buttons or the arrow keys zoom with the picked voice. Steps
       * closer than 60 ms merge into one, as a real wheel's would, and a
       * gesture ends 180 ms after its last step.
       */
      function wireZoomPad(pad) {
        const readout = pad.querySelector("#try-zoom-level");
        let z = 0.5;
        let gesture = null;
        let last = -1;
        let idle = 0;
        const zoomBy = (dir) => {
          const v =
            voiceFor("zoom") ?? STEPS.find((s) => s.id === "zoom").variants[0];
          if (picks.zoom === "none") return;
          const c = audio();
          z = Math.max(0, Math.min(1, z + dir * 0.06));
          readout.textContent = `${Math.round(z * 100)}%`;
          if (!gesture) gesture = v.gesture(c, master);
          if (c.currentTime - last >= 0.06) {
            gesture.step(c.currentTime + 0.01, dir, z);
            last = c.currentTime;
          }
          clearTimeout(idle);
          idle = setTimeout(() => {
            gesture?.end(c.currentTime + 0.01);
            gesture = null;
          }, 180);
        };
        pad.addEventListener(
          "wheel",
          (event) => {
            event.preventDefault();
            if (event.deltaY !== 0) zoomBy(event.deltaY < 0 ? 1 : -1);
          },
          { passive: false },
        );
        for (const button of pad.querySelectorAll("[data-pad]"))
          button.addEventListener("click", () =>
            zoomBy(Number(button.dataset.pad)),
          );
        pad.addEventListener("keydown", (event) => {
          if (event.key === "ArrowUp" || event.key === "+") zoomBy(1);
          else if (event.key === "ArrowDown" || event.key === "-") zoomBy(-1);
          else return;
          event.preventDefault();
        });
      }

      function renderSummary() {
        const out = {};
        for (const step of STEPS) out[step.id] = picks[step.id] ?? null;
        const text = JSON.stringify(out, null, 2);
        const missing = STEPS.filter((s) => !picks[s.id]).map((s) => s.title);
        stepEl.innerHTML = `<h2>Your picks</h2>
          <p class="where">Copy this block and paste it back into the planning session.${
            missing.length ? ` Not picked yet: ${missing.join(", ")}.` : ""
          }</p>
          <pre class="picks" id="picks">${text}</pre>
          <div class="actions"><button type="button" id="copy-picks">Copy picks</button>
          <button type="button" id="restart">Start again</button></div>`;
        document
          .getElementById("copy-picks")
          .addEventListener("click", async (event) => {
            try {
              await navigator.clipboard.writeText(text);
              event.target.textContent = "Copied";
            } catch {
              const range = document.createRange();
              range.selectNodeContents(document.getElementById("picks"));
              const sel = getSelection();
              sel.removeAllRanges();
              sel.addRange(range);
              event.target.textContent = "Selected: press Copy";
            }
            playPicked("copy");
          });
        document.getElementById("restart").addEventListener("click", () => {
          index = 0;
          save();
          render();
        });
      }

      /* ===================================================================
       * Control mock-ups. Each one drives the page's master level, the way
       * the real control drives the site's. The dial is a native radio group
       * under a drawn octagon (arrow keys, Tab and the announcement come from
       * the browser); the lever is a native checkbox with role="switch".
       * =================================================================== */

      const LEVELS = [
        "MUTE",
        ...Array.from({ length: 11 }, (_, i) => String(i + 1)),
      ];
      const SWEEP = 240;
      const angleOf = (i) => -SWEEP / 2 + (i * SWEEP) / (LEVELS.length - 1);
      let lastAudible = 6;

      function octagon(r, cy) {
        return Array.from({ length: 8 }, (_, i) => {
          const a = ((i * 45 + 22.5) * Math.PI) / 180;
          return `${(50 + r * Math.sin(a)).toFixed(3)},${((cy ?? 50) - r * Math.cos(a)).toFixed(3)}`;
        }).join(" ");
      }
      let gradientCount = 0;
      function knobSvg() {
        gradientCount += 1;
        const id = `face-${gradientCount}`;
        return `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="${id}" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#e6f9ff"/><stop offset="45%" stop-color="#2a6070"/><stop offset="100%" stop-color="#06141c"/></radialGradient></defs>
          <polygon class="lip" points="${octagon(48, 54)}"/><polygon class="rim" points="${octagon(48)}"/>
          <polygon class="face" fill="url(#${id})" points="${octagon(36)}"/><line class="needle" x1="50" y1="40" x2="50" y2="14"/></svg>`;
      }

      function dialHtml(name, mini) {
        const labels = LEVELS.map((label, i) => {
          const rad = (angleOf(i) * Math.PI) / 180;
          const pos = mini
            ? ""
            : `style="--x:${Math.sin(rad).toFixed(3)};--y:${(-Math.cos(rad)).toFixed(3)}"`;
          const cls = mini ? "sr-only" : "detent";
          return `<label class="${cls}" ${pos}><input class="sr-only" type="radio" name="${name}" value="${i}" />${label}</label>`;
        }).join("");
        return `<fieldset class="dial${mini ? " mini" : ""}"><legend class="sr-only">Volume</legend>
          <span class="knob">${knobSvg()}</span>${labels}</fieldset>`;
      }

      function wireDial(fieldset) {
        const knob = fieldset.querySelector(".knob");
        const radios = [...fieldset.querySelectorAll("input")];
        const show = (lv) => {
          knob.style.setProperty("--angle", `${angleOf(lv)}deg`);
          radios[lv].checked = true;
        };
        const set = (lv) => {
          const next = Math.max(0, Math.min(LEVELS.length - 1, lv));
          if (next === level) return;
          if (next > 0) lastAudible = next;
          setMasterLevel(next);
          playPicked("detent");
        };
        for (const r of radios)
          r.addEventListener("change", () => set(Number(r.value)));
        // Relative drag: the knob turns by how far the pointer moves round it,
        // so a grab never jumps the value.
        let grab = null;
        knob.addEventListener("pointerdown", (event) => {
          knob.setPointerCapture(event.pointerId);
          const box = knob.getBoundingClientRect();
          const cx = box.left + box.width / 2;
          const cy = box.top + box.height / 2;
          grab = {
            cx,
            cy,
            from: Math.atan2(event.clientX - cx, cy - event.clientY),
            start: level,
            mini: fieldset.classList.contains("mini"),
          };
          radios[level].focus();
        });
        knob.addEventListener("pointermove", (event) => {
          if (!grab || !knob.hasPointerCapture(event.pointerId)) return;
          let turned;
          if (grab.mini) {
            turned = (grab.cy - event.clientY) / 9;
          } else {
            const now = Math.atan2(
              event.clientX - grab.cx,
              grab.cy - event.clientY,
            );
            turned =
              ((now - grab.from) * 180) /
              Math.PI /
              (SWEEP / (LEVELS.length - 1));
          }
          set(grab.start + Math.round(turned));
        });
        knob.addEventListener("pointerup", () => {
          grab = null;
        });
        // Wheel: 40 units of delta make one detent; after a step the dial
        // ignores the wheel until 180 ms of quiet, so one flick is one step.
        let acc = 0;
        let locked = false;
        let quiet = 0;
        fieldset.addEventListener(
          "wheel",
          (event) => {
            event.preventDefault();
            clearTimeout(quiet);
            quiet = setTimeout(() => {
              locked = false;
              acc = 0;
            }, 180);
            if (locked) return;
            acc += event.deltaY;
            if (Math.abs(acc) < 40) return;
            set(level - Math.sign(acc));
            acc = 0;
            locked = true;
          },
          { passive: false },
        );
        show(level);
        levelListeners.add(show);
      }

      function muteChip() {
        return `<button type="button" class="chip" data-mute aria-pressed="false" aria-label="Mute sound">${SPEAKER}</button>`;
      }
      function wireMute(button) {
        const show = (lv) => {
          button.setAttribute("aria-pressed", String(lv === 0));
          button.innerHTML = lv === 0 ? MUTED : SPEAKER;
        };
        button.addEventListener("click", () => {
          if (level === 0) {
            setMasterLevel(lastAudible || 6);
            playPicked("toggle");
          } else {
            lastAudible = level;
            playPicked("toggle");
            setMasterLevel(0);
          }
        });
        show(level);
        levelListeners.add(show);
      }

      function mountMocks() {
        levelListeners.clear();
        levelListeners.add(syncMaster);
        const brand =
          '<span class="brand">NorthGuild <b>/ gmt</b></span><span class="slack"></span>';
        const a = stepEl.querySelector('[data-mock="A"]');
        a.innerHTML = `<div class="mock-bar">${brand}${muteChip()}<button type="button" class="chip narrow" data-deck aria-expanded="false" aria-label="Sound settings">${CHEVRON}</button></div>
          <div class="deck bevel" hidden>${dialHtml("vol-a")}
          <label class="lever"><span class="on">AURA</span><span class="plate" aria-hidden="true"><span class="nut"></span><span class="bat"></span></span><span class="off">OFF</span>
          <input class="sr-only" type="checkbox" role="switch" checked /></label></div>`;
        const deckBtn = a.querySelector("[data-deck]");
        const deck = a.querySelector(".deck");
        deckBtn.addEventListener("click", () => {
          const open = deck.hidden;
          deck.hidden = !open;
          deckBtn.setAttribute("aria-expanded", String(open));
          playPicked(open ? "open" : "close");
        });
        a.querySelector(".lever input").addEventListener("change", () =>
          playPicked("toggle"),
        );
        a.querySelector(".lever .plate").addEventListener("click", (event) => {
          event.preventDefault();
          a.querySelector(".lever input").click();
        });
        wireDial(a.querySelector("fieldset"));

        const b = stepEl.querySelector('[data-mock="B"]');
        b.innerHTML = `<div class="mock-bar">${brand}${muteChip()}${dialHtml("vol-b", true)}<span class="level-chip" data-level></span></div>`;
        wireDial(b.querySelector("fieldset"));

        const cMock = stepEl.querySelector('[data-mock="C"]');
        cMock.innerHTML = `<div class="mock-bar">${brand}<span class="fader">${muteChip()}<input type="range" min="0" max="11" step="1" aria-label="Volume" /></span><span class="level-chip" data-level></span></div>`;
        const fader = cMock.querySelector('input[type="range"]');
        fader.addEventListener("input", () => {
          const next = Number(fader.value);
          if (next > 0) lastAudible = next;
          setMasterLevel(next);
          playPicked("detent");
        });
        levelListeners.add((lv) => {
          fader.value = String(lv);
          fader.setAttribute("aria-valuetext", lv === 0 ? "Muted" : String(lv));
        });

        for (const chip of stepEl.querySelectorAll("[data-mute]"))
          wireMute(chip);
        const showLevel = (lv) => {
          for (const el of stepEl.querySelectorAll("[data-level]"))
            el.textContent = lv === 0 ? "MUTE" : String(lv);
        };
        showLevel(level);
        levelListeners.add(showLevel);
      }

      /* ===================================================================
       * Master volume and paging
       * =================================================================== */

      const masterInput = document.getElementById("master");
      const masterOut = document.getElementById("master-out");
      function syncMaster(lv) {
        masterInput.value = String(lv);
        masterOut.textContent = lv === 0 ? "MUTE" : String(lv);
      }
      levelListeners.add(syncMaster);
      masterInput.addEventListener("input", () => {
        const next = Number(masterInput.value);
        if (next > 0) lastAudible = next;
        audio();
        setMasterLevel(next);
        playPicked("detent");
      });
      document.getElementById("stop-all").addEventListener("click", stopAll);
      backBtn.addEventListener("click", () => {
        index = Math.max(0, index - 1);
        save();
        render();
      });
      nextBtn.addEventListener("click", () => {
        index = Math.min(STEPS.length, index + 1);
        save();
        render();
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stopAll();
      });
      render();
    </script>
  </body>
</html>
