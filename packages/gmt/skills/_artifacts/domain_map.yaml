    tasks:
      - Add/subtract dates with overflow control
      - Calculate differences with rounding options
      - Add/subtract business days (skip weekends and holidays)
      - Count working days between two dates against a business calendar
      - Expand holiday rules (fixed, nth weekday, Easter-relative, other calendars) into dates and a business calendar
      - Move a holiday off a weekend with an observance policy
      - Roll a date onto a working day (following, modifiedFollowing, preceding, modifiedPreceding, endOfMonth, none)
      - Merge two jurisdictions' calendars into the working days they share
