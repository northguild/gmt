library:
  name: '@northguild/gmt'
  version: 1.20.0
  repository: https://github.com/northguild/gmt.git
  description: Temporal-based date and time utilities with timezone support and polyfill integration
  primary_framework: framework-agnostic

domains:
  - name: Core Date Operations
    slug: core-date-operations
    description: Basic date/time operations using plain (timezone-free) Temporal types
  - name: Arithmetic
    slug: arithmetic
    description: Add/subtract, diff, clamp/closest, ISO 8601 duration strings, and interval range math across plain, zoned, unix, and utc
  - name: Zoned Date Operations
    slug: zoned-date-operations
    description: IANA timezone-aware date operations with DST disambiguation control
  - name: Integration
    slug: integration
    description: Integrating gmt with application frameworks and linting tools
  - name: Industry Layers
    slug: industry-layers
    description: One skill per industry layer (gnss/, transport/, intermodal/, workforce/) drawing on the core skills; core namespaces such as timescale/ stay in the core skills
  - name: Contributor
    slug: contributor
    description: Library maintainer workflows — issues, PRs, implementation, testing

skills:
  - name: GMT Basics
    slug: gmt-basics
    domain: core-date-operations
    description: Get current values, parse components, read ISO week/ordinal/quarter/fiscal-period identifiers, format for display, format relative time, compare dates, and validate strings/timezones/intervals
