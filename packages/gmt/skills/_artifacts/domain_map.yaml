cross_references:
  - from: gmt-basics
    to: gmt-arithmetic
    reason: Getting the current date is often the first step before calculating future/past dates
  - from: gmt-basics
    to: gmt-timezone
    reason: Timezones need zoned get/format/compare/validate variants — covered here and in gmt-timezone
  - from: gmt-basics
    to: gmt-integration
    reason: Basics may surface cache key or lint needs handled by gmt-integration
  - from: gmt-basics
    to: issue-creation
    reason: When a needed function doesn't exist, gmt-basics points to issue-creation
  - from: gmt-arithmetic
    to: gmt-timezone
    reason: Arithmetic that crosses DST needs zoned disambiguation control
  - from: gmt-arithmetic
    to: gmt-integration
    reason: spanMs/spanNs ignore leap seconds; a leap-second-exact span goes through toTAI or leapSecondsBetween
  - from: gmt-basics
    to: gmt-integration
    reason: hasSecond60 finds a second 60; isLeapSecond in timescale/ says whether it was a real leap second
  - from: gmt-timezone
    to: gmt-transport
    reason: Transport legs, cut-offs and punctuality build on zoned arithmetic and DST resolution
  - from: gmt-timezone
    to: gmt-intermodal
    reason: Free time, billing deadlines and EDI timestamps build on zoned local days and resolveLocal
  - from: gmt-transport
    to: gmt-intermodal
    reason: multimodalETA takes the Leg[] that scheduleDelivery takes
  - from: gmt-integration
    to: gmt-gnss
    reason: GNSS offsets rest on the leap-second table in timescale/; a second 60 is accepted only on a listed insertion day
  - from: gmt-arithmetic
    to: gmt-workforce
    reason: Hours-of-work rules are built on interval and duration arithmetic
  - from: issue-creation
    to: new-method-implementation
    reason: Issue is first step; implementation skill guides actual code
  - from: new-method-implementation
    to: unit-test-generation
    reason: Implementation must be accompanied by tests
  - from: pr-contribution
    to: new-method-implementation
    reason: PRs follow implementation guidelines

