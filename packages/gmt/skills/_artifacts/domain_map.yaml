    type: core
    packages:
      - '@northguild/gmt'
    covers:
      - utcToGnss
      - gnssToUtc
      - gnssWeekToUtc
      - utcToGnssWeek
      - rinexWeekToUtc
      - utcToRinexWeek
    tasks:
      - Convert between UTC and the time of any of the six GNSS systems as peers (GPS, Galileo, BeiDou, QZSS, GLONASS, NavIC)
      - Decode a broadcast GNSS week and time of week by its named counter, with an integer era, "rolling" or a firmware-date notBefore pivot
      - Read a continuous RINEX navigation-file week, which never wraps, apart from a broadcast week

