  - name: GMT Integration
    slug: gmt-integration
    domain: integration
    description: Integrate gmt with application frameworks — cache keys, router/query params, table-sort keys, nanosecond and foreign-epoch boundaries, TAI and the closed IERS leap-second table (taiMinusUtc/leapSecondsBetween/nextLeapSecond/isLeapSecond/toTAI/fromTAI), and lint package selection (ESLint, Biome, Oxlint). GNSS time is in gmt-gnss
    type: composition
    packages:
      - '@northguild/gmt'
      - '@northguild/gmt-eslint'
      - '@northguild/gmt-biome'
      - '@northguild/gmt-oxlint'
    covers:
      - taiMinusUtc
      - leapSecondsBetween
      - nextLeapSecond
      - isLeapSecond
      - toTAI
      - fromTAI
    tasks:
      - Create stable cache keys from date values
      - Use with routers and query params
      - Read a UTC or Unix instant's fields in the system zone with timeZone "local"
      - Use with table libraries for sort keys
      - Use with state management
      - Serialize nanosecond timestamps across a JSON boundary
      - Truncate nanoseconds to a storage engine's precision
      - Tell a 0n sentinel apart from 0n the epoch with precision/validate
      - Convert between ISO 8601 and a foreign epoch (NTP, FILETIME, .NET ticks, Excel, PostgreSQL)
      - Read TAI − UTC at an instant, count the leap seconds between two instants, and find the next one from the closed IERS table
      - Tell a real inserted leap second from a well-formed second 60 (isLeapSecond, not hasSecond60)
      - Convert between UTC and a TAI time-scale string, a listed leap second included
      - Choose ESLint config
      - Choose Biome config
      - Choose Oxlint config

