      - isValidFiscalExtraWeek
      - isValidFiscalYearLabel
      - hasSecond60
    tasks:
      - Get current date/time/timestamp as ISO strings
      - Parse individual components from date/time strings
      - Decode a fixed producer format with a UTS #35 token pattern, literal quotes included
      - Read a two-digit yy pattern token in a hundred-year window the caller names (yearWindow)
      - Decode RFC 2822/5322, HTTP, SQL, RFC 3339 fixed grammars
      - Format date/time for display with locale support
      - Format relative date/time ("yesterday", "in 2 hours")
      - Format calendar-style ("tomorrow at 2:30 PM")
      - Get standalone locale calendar names
      - Compare date values for ordering
      - Check locale-aware weekends and business days
      - Validate date/time strings, timezones, and intervals
      - Test whether a string has a second-60 field, real leap second or not (hasSecond60)
      - Check an RFC 3339, RFC 2822/5322, HTTP-date or SQL timestamp string with the validator that agrees with its parser, not the shape-only regex
      - Check that a string is a real UTC instant in the plain RFC 3339 spelling YYYY-MM-DDTHH:MM:SS[.f]Z, before it goes to storage or to a reader that is not Temporal (isValidUtcTimestamp)
      - List DST transitions for a timezone
      - Read the ISO week date or ordinal date a calendar date falls in
      - Read the calendar or fiscal quarter a date falls in
      - Place a date in a 52/53-week retail calendar period (4-5-4, 4-4-5, 5-4-4), stating which period gets a 53rd week and which calendar year names the fiscal year

