name: Feature
description: A date or time job GMT cannot do yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: job
    attributes:
      label: The job
      description: What you need to compute, with an example input and the result you expect.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The code you write now, with Temporal, another library or by hand.
      render: typescript
  - type: input
    id: standard
    attributes:
      label: Standard
      description: The standard that defines the result, if one does, such as ISO 8601, RFC 5545 or an industry format.
