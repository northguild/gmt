name: Deploy Dox

on:
  push:
    branches:
      - main
  # Refreshes the /upstream/ tracker even on a week with no push — see
  # scripts/upstream.mjs. workflow_dispatch is the manual "refresh it now" button.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# An in-flight deploy should never be cancelled mid-publish (unlike ci.yml's
# cancel-in-progress: true, which is fine for tests but wrong for deploys).
concurrency:
  group: deploy-dox-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read # deployments: write is only needed when passing gitHubToken to
  # wrangler-action to create Pages deployment records; this deploys a plain Worker
  # and never passes gitHubToken, so contents: read alone is sufficient.

jobs:
  deploy:
    name: Build & deploy apps/dox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Approve pnpm build scripts
        run: pnpm approve-builds --all

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The build's generate step refreshes the /upstream/ tracker from GitHub
      # (scripts/upstream.mjs refresh). It is best-effort: without a token or on a
      # rate limit it keeps the committed snapshot and never fails the build.
      - name: Build apps/dox (builds @northguild/gmt first)
        run: pnpm --filter "@gmt/dox..." -r --if-present run build
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/dox
          command: deploy
          wranglerVersion: "4.126.0"
