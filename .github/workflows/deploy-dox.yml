name: Deploy Dox

on:
  # After Release, never alongside it. Release runs on every push to main, so this
  # still deploys every merge. A push that publishes pushes its
  # `@northguild/gmt@X.Y.Z` tag before Release completes, so the docs build sees
  # the release it belongs to; running in parallel, as this used to, could build
  # before the tag existed. The site deploys whatever Release concluded, success
  # or failure.
  #
  # Failure mode: if Release ever stops running on pushes to main (renamed,
  # disabled, or given a path filter), merges stop deploying the docs. The daily
  # schedule and workflow_dispatch below still deploy.
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  # Refreshes the /upstream/ tracker even on a week with no push — see
  # scripts/upstream.mjs. workflow_dispatch is the manual "refresh it now" button.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# An in-flight deploy should never be cancelled mid-publish (unlike ci.yml's
# cancel-in-progress: true, which is fine for tests but wrong for deploys).
concurrency:
  group: deploy-dox-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read # Wrangler authenticates with the Cloudflare token, not GitHub's.

# The jobs name their Node with actions/setup-node, and that is the Node they must run.
# package.json pins a Node through devEngines.runtime for local work. In CI, every
# `pnpm install` passes --no-runtime so pnpm does not download that pin, and
# verifyDepsBeforeRun is off so a later `pnpm run` or `pnpm exec` does not quietly run an
# install without the flag and put the pinned Node ahead of the job's Node.
env:
  pnpm_config_verify_deps_before_run: "false"

jobs:
  deploy:
    name: Build & deploy apps/dox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit Release ran on, not whatever main is now; the schedule and
          # manual runs have no workflow_run, so they take main's head.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history and every tag, so the build can read release tags.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Approve pnpm build scripts
        run: pnpm approve-builds --all

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      # The build's generate step refreshes the /upstream/ tracker from GitHub
      # (scripts/upstream.mjs refresh). It is best-effort: without a token or on a
      # rate limit it keeps the committed snapshot and never fails the build.
      - name: Build apps/dox (builds @northguild/gmt first)
        run: pnpm --filter "@gmt/dox..." -r --if-present run build
        env:
          GH_TOKEN: ${{ github.token }}

      # The Wrangler in apps/dox's lockfile, run through pnpm. Not
      # cloudflare/wrangler-action: it runs npx and `npm i`, and npm refuses to
      # run on any Node that misses devEngines.runtime, so the job's Node would
      # have to match the local pin.
      - name: Deploy the Worker
        working-directory: apps/dox
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The redirect and routing rows of the live site (apps/dox/scripts/deploy-smoke.mjs).
      # Retries for route propagation; a failure marks the run red and does not roll back.
      - name: Smoke-test the deployed routes
        run: node apps/dox/scripts/deploy-smoke.mjs
