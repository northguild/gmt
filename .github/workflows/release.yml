name: Release

# Publishing is triggered by one thing: a push to main that moves a version in a
# `packages/*/package.json`. That only happens when someone has run
# `pnpm run changeset:version` in a branch and opened a PR with the result.
#
#   push moves a version -> publish : pack, publish to npm, push tags,
#                                     cut GitHub Releases
#   anything else        -> nothing
#
# So merging changeset-carrying feature PRs accumulates unreleased changes on
# main indefinitely and publishes nothing. The release is a deliberate, separate
# PR whose diff is the version bumps and the CHANGELOG text — reviewed as an
# ordinary PR, with the ordinary required checks, before anything reaches npm.
#
# `changesets/action/select-mode` still decides the mode, but its `version` mode
# is deliberately unimplemented: there is no job for it, so pending changesets
# on main are a no-op here. We do not open a bot-authored "Version Packages" PR.
#
# The mode is not enough on its own. select-mode returns `publish` whenever ANY
# package version on main is missing from npm — equally true of pre-existing
# drift — so an unrelated commit could otherwise publish a backlog nobody asked
# for. The version guard below requires that THIS push moved a version.
#
# Nothing here holds an npm token. The publish job runs with `id-token: write`
# and npm exchanges that for a short-lived credential (trusted publishing),
# which also attaches a provenance attestation.
#
# ⚠ The `npm trust` entries pin this file's basename (`release.yml`) and the
# `release` environment. Renaming either breaks every publish with a 401 until
# all four entries are re-registered — see PUBLISHING.md.
#
# The changesets actions are pinned to a commit SHA, not to `@v2`: upstream's
# `v2` is a *branch* that moves, and this job holds `id-token: write`. Bump the
# pin deliberately, checking the diff, the way you would any other dependency.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      announce:
        description: Post only the Discord announcement for these already-published tags, space-separated (e.g. @northguild/gmt@1.17.0). Publishes nothing. Leave empty to publish.
        type: string
        default: ""

# A release must never be cancelled halfway through, so this queues rather than
# cancelling in-flight runs the way ci.yml does.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  mode:
    name: Select mode
    # An announce-only dispatch must not publish, and a dispatch bypasses the
    # version guard, so skip the mode (and with it `publish`) entirely.
    if: ${{ inputs.announce == '' || inputs.announce == null }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # select-mode uploads the publish plan as an artifact
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      publish-plan: ${{ steps.select.outputs.publish-plan-artifact-id }}
      version-changed: ${{ steps.bump.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm approve-builds --all
      - run: pnpm install --frozen-lockfile

      - uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: select

      # `publish` mode on its own is not enough to ship. select-mode returns it
      # whenever *any* package version on main is missing from npm — which is
      # equally true of pre-existing drift, so an unrelated commit (a docs typo,
      # say) could otherwise publish a backlog nobody asked for. Require that
      # THIS push actually moved a version, i.e. that it is a release PR carrying
      # the output of `pnpm run changeset:version`. Publishing is welded to that
      # and nothing else.
      - name: Did this push move a package version?
        id: bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # A manual dispatch is a deliberate human action, and the documented
          # way to finish a half-completed publish, so it bypasses the guard.
          if [ "$EVENT_NAME" != "push" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manually dispatched — version guard bypassed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Re-running a failed job from the Actions UI replays the original
          # push payload, so `before` survives and a retry still passes.
          BASE="$BEFORE"
          if [ -z "$BASE" ]             || [ "$BASE" = "0000000000000000000000000000000000000000" ]             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse -q --verify "HEAD^1" || true)
          fi

          if [ -z "$BASE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No usable base commit to diff against, so refusing to publish. Use Run workflow if this really is a release."
            exit 0
          fi

          CHANGED=false
          for MANIFEST in packages/*/package.json; do
            PKG=$(basename "$(dirname "$MANIFEST")")

            if [ "$(node -p "require('./$MANIFEST').private === true")" = "true" ]; then
              continue
            fi

            NOW=$(node -p "require('./$MANIFEST').version")
            # A package added in this push has no manifest at BASE; the empty
            # WAS then reads as a change, which is what we want.
            WAS=$(git show "$BASE:$MANIFEST" 2>/dev/null               | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{process.stdout.write(JSON.parse(d).version||"")}catch{}})'               || true)

            if [ "$NOW" != "$WAS" ]; then
              echo "$PKG: ${WAS:-<new>} -> $NOW"
              CHANGED=true
            fi
          done

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Explain the decision
        env:
          MODE: ${{ steps.select.outputs.mode }}
          CHANGED: ${{ steps.bump.outputs.changed }}
        run: |
          {
            echo "## Release mode: \`$MODE\`"
            echo
            case "$MODE" in
              version) echo "Changesets are pending on \`main\`, which publishes nothing. They ship when someone runs \`pnpm run changeset:version\` and merges the resulting PR — see PUBLISHING.md." ;;
              none)    echo "No changesets pending and nothing unpublished. Nothing to do." ;;
              publish)
                if [ "$CHANGED" = "true" ]; then
                  echo "A package version moved in this push — publishing."
                else
                  echo "⚠️ Some package version on \`main\` is missing from npm, but **this push did not move any version**, so publishing is blocked by the version guard."
                  echo
                  echo "That is pre-existing drift, not a release. Run \`pnpm run changeset:version\` and merge the result to ship, or use **Run workflow** to publish the backlog deliberately."
                fi ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to npm
    needs: mode
    # Both conditions, deliberately: the right mode AND a version actually moved
    # in this push. See the version guard in the `mode` job.
    if: needs.mode.outputs.mode == 'publish' && needs.mode.outputs.version-changed == 'true'
    runs-on: ubuntu-latest
    # Protected environment: holds DISCORD_WEBHOOK, and is where required
    # reviewers go if you ever want a human click between merge and npm.
    environment: release
    permissions:
      contents: write # push git tags, create GitHub Releases
      id-token: write # OIDC -> npm trusted publishing
      actions: read # read the publish plan artifact from the `mode` job
    env:
      # Job-level so the notify step can test whether it is configured at all —
      # an unset webhook must not fail an otherwise successful publish.
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          # Deliberately no `cache: pnpm` here, unlike every other job. npm's
          # release guidance is to never restore a dependency cache in a build
          # that publishes — a poisoned entry would end up inside the tarball.
          # This job runs a handful of times a month; a cold install is cheap.

      # Trusted publishing needs npm >= 11.5.1, which is newer than the npm
      # bundled with Node 24.
      - name: Ensure an npm with OIDC support
        run: npm install -g npm@latest

      - run: pnpm approve-builds --all
      - run: pnpm install --frozen-lockfile

      # Last gate before the tarballs become irreversible. ci.yml already ran
      # the full Node x timezone matrix on this commit; this re-runs the
      # publishable packages' own suites against the exact tree being packed.
      - name: Build
        run: pnpm --filter "./packages/*" --if-present run build

      - name: Test
        run: pnpm --filter "./packages/*" --if-present run test

      - uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: pack
        with:
          publish-plan-artifact-id: ${{ needs.mode.outputs.publish-plan }}

      # GitHub Releases are cut in the next step, not here. The action posts the
      # whole CHANGELOG section as the body, and GitHub rejects one over 125,000
      # characters. That error fails this step after npm has published, which
      # left `published` unset and skipped the Discord announcement (1.16.0).
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: publish
        with:
          pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
          # Changesets' own tag format, `@northguild/<pkg>@<version>` — the same
          # one every existing tag and GitHub Release already uses.
          push-git-tags: true
          create-github-releases: false

      - name: Create the GitHub Releases
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.publish.outputs.published-packages }}
        run: |
          set -euo pipefail
          node -e 'for (const p of JSON.parse(process.env.PUBLISHED)) console.log(p.name, p.version)' |
            while read -r NAME VERSION; do
              TAG="$NAME@$VERSION"
              if gh release view "$TAG" > /dev/null 2>&1; then
                echo "$TAG already has a GitHub Release."
                continue
              fi
              node scripts/release-notes.mjs "$NAME" "$VERSION" > "$RUNNER_TEMP/notes.md"
              PRERELEASE=()
              if [[ "$VERSION" == *-* ]]; then PRERELEASE=(--prerelease); fi
              gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag "${PRERELEASE[@]}"
            done

      # `!cancelled()`: the packages are on npm by now, so a failure creating a
      # GitHub Release must not also swallow the announcement.
      - name: Compose the announcement
        if: ${{ !cancelled() && steps.publish.outputs.published == 'true' }}
        env:
          PUBLISHED: ${{ steps.publish.outputs.published-packages }}
        run: |
          set -euo pipefail
          {
            echo "DISCORD_MESSAGE<<GMT_DISCORD_EOF"
            node scripts/release-announcement.mjs
            echo
            echo "GMT_DISCORD_EOF"
          } >> "$GITHUB_ENV"

      # Pinned to 0.3.2's commit rather than the mutable tag, because this step
      # runs in the job holding `id-token: write`. Same action, same version.
      #
      # Never fails the job: by the time it runs the packages are already on
      # npm, so a red run would only invite a re-run that cannot help.
      - name: Announce on Discord
        if: ${{ !cancelled() && steps.publish.outputs.published == 'true' && env.DISCORD_WEBHOOK != '' }}
        continue-on-error: true
        uses: Ilshidur/action-discord@0c4b27844ba47cb1c7bee539c8eead5284ce9fa9 # 0.3.2
        with:
          args: ${{ env.DISCORD_MESSAGE }}

  # Run workflow with `announce` set posts the Discord message for versions that
  # are already on npm, and publishes nothing. It is for a release whose
  # announcement was lost, such as one whose publish step failed after npm.
  announce:
    name: Announce on Discord
    if: ${{ inputs.announce != '' && inputs.announce != null }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse without a webhook
        if: env.DISCORD_WEBHOOK == ''
        run: |
          echo "::error::DISCORD_WEBHOOK is not set in the release environment."
          exit 1

      - name: Compose the announcement
        env:
          TAGS: ${{ inputs.announce }}
        run: |
          set -euo pipefail
          for TAG in $TAGS; do
            if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
              echo "::error::$TAG is not a tag in this repository."
              exit 1
            fi
          done
          # `@northguild/gmt@1.16.0` splits at its last `@` into name and version.
          PUBLISHED=$(node -e '
            const tags = process.env.TAGS.split(/\s+/).filter(Boolean);
            console.log(JSON.stringify(tags.map((t) => {
              const at = t.lastIndexOf("@");
              return { name: t.slice(0, at), version: t.slice(at + 1) };
            })));
          ')
          {
            echo "DISCORD_MESSAGE<<GMT_DISCORD_EOF"
            PUBLISHED="$PUBLISHED" node scripts/release-announcement.mjs
            echo
            echo "GMT_DISCORD_EOF"
          } >> "$GITHUB_ENV"

      - name: Announce on Discord
        uses: Ilshidur/action-discord@0c4b27844ba47cb1c7bee539c8eead5284ce9fa9 # 0.3.2
        with:
          args: ${{ env.DISCORD_MESSAGE }}
