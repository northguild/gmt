name: Dox gates nightly

# The PR job (ci.yml, `dox-gates`) checks the changed pages in Chromium. This sweep checks every page
# in three browsers and both themes, and files what fails as a `bug` issue, one open issue per
# finding (apps/dox/scripts/gates/issue-plan.mjs). A failing gate fails its leg; the report job still
# runs and files.
#
# It skips a night when nothing under apps/dox/ or pnpm-lock.yaml changed since the last run that
# filed its findings (the `decide` job; the rule is apps/dox/scripts/gates/nightly-decide.mjs), and always runs on
# Sundays. A manual dispatch with `force` runs it anyway; `force_finding` also files one
# [dry run] issue for a synthetic finding, to prove the filing path without a real failure.
#
# Legs: --shard i/n splits each gate's sorted page list round-robin, so the legs of one browser
# share the work. The shard counts are sized from measured local times (built.md, Runbooks, "The
# nightly gate sweep"). Adding or removing a leg means changing the matrix and the LEGS list of the
# report job, which names every leg so one that crashed without uploading is still filed.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if nothing changed"
        type: boolean
        required: false
        default: false
      force_finding:
        description: "Dry run: file one [dry run] issue for a synthetic finding"
        type: boolean
        required: false
        default: false
  schedule:
    # Daily 04:23 UTC; skips when nothing changed.
    - cron: "23 4 * * *"
    # Sundays 04:41 UTC; always runs.
    - cron: "41 4 * * 0"

concurrency:
  group: dox-gates-nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The job runs the Node it names, not the devEngines.runtime pin.
  pnpm_config_verify_deps_before_run: "false"

jobs:
  decide:
    name: Changed since the last run?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      # The earlier run is the newest finished run on main that filed its findings: its report job
      # succeeded (the run itself ends `failure` when a gate failed), or it skipped the night and
      # ended `success`, which leaves the tree it compared against. A run whose report job failed
      # never counts, so its findings are swept and filed again the next night. Without
      # `actions: read` a listing fails and the sweep runs (fail open), saying why.
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          FORCE: ${{ inputs.force }}
          FORCE_FINDING: ${{ inputs.force_finding }}
        run: |
          last=""
          LAST_ERROR=""
          if ! runs=$(gh run list --workflow dox-gates-nightly.yml --branch main --status completed \
              --limit 20 --json databaseId,headSha,conclusion \
              --jq '.[] | select(.conclusion == "success" or .conclusion == "failure") | "\(.databaseId) \(.headSha) \(.conclusion)"' 2>err.txt); then
            LAST_ERROR=$(head -c 200 err.txt | tr '\n' ' ')
            runs=""
          fi
          while read -r id sha conclusion; do
            [ -n "$id" ] || continue
            if ! report=$(gh run view "$id" --json jobs \
                --jq '[.jobs[] | select(.name == "Report to issues")][0].conclusion // ""' 2>err.txt); then
              LAST_ERROR=$(head -c 200 err.txt | tr '\n' ' ')
              break
            fi
            if [ "$report" = success ] || { [ "$conclusion" = success ] && [ "$report" = skipped ]; }; then
              last="$sha"
              break
            fi
          done <<< "$runs"
          CHANGED=""
          if [ -n "$last" ]; then
            if git merge-base --is-ancestor "$last" HEAD 2>/dev/null; then
              CHANGED=$(git diff --name-only "$last" HEAD -- apps/dox/ pnpm-lock.yaml)
            else
              last=""
            fi
          fi
          export LAST_SHA="$last" LAST_ERROR CHANGED
          node apps/dox/scripts/gates/nightly-decide.mjs

  sweep:
    name: Sweep (${{ matrix.leg }})
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: chromium-1, browser: chromium, shard: "1/6" }
          - { leg: chromium-2, browser: chromium, shard: "2/6" }
          - { leg: chromium-3, browser: chromium, shard: "3/6" }
          - { leg: chromium-4, browser: chromium, shard: "4/6" }
          - { leg: chromium-5, browser: chromium, shard: "5/6" }
          - { leg: chromium-6, browser: chromium, shard: "6/6" }
          - { leg: webkit-1, browser: webkit, shard: "1/3" }
          - { leg: webkit-2, browser: webkit, shard: "2/3" }
          - { leg: webkit-3, browser: webkit, shard: "3/3" }
          - { leg: firefox-1, browser: firefox, shard: "1/3" }
          - { leg: firefox-2, browser: firefox, shard: "2/3" }
          - { leg: firefox-3, browser: firefox, shard: "3/3" }
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @gmt/dox exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      - name: Install ${{ matrix.browser }}
        run: pnpm --filter @gmt/dox exec playwright install --with-deps ${{ matrix.browser }}

      # One screen to the log and the job summary. Every gate runs once more on its failing pages
      # (--retries 1); a pass there is FLAKY and never filed.
      - name: Gates, every page (shard ${{ matrix.shard }})
        run: >
          pnpm --filter dox gates --all --tier nightly --browsers ${{ matrix.browser }}
          --themes dark,light --retries 1 --shard ${{ matrix.shard }}

      # `.gates/` starts with a dot, and upload-artifact skips dot paths unless told otherwise; without
      # `include-hidden-files` nothing uploads and the report files every leg as could-not-run.
      - name: Upload the findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dox-gates-${{ matrix.leg }}-${{ github.run_id }}
          path: |
            apps/dox/.gates/summary.json
            apps/dox/.gates/*.ndjson
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # `!cancelled()` runs this after a failed leg (the gates failing is why it exists) and not after a
  # person cancels the run. One job that installs nothing and runs first-party Node and `gh`, so
  # there is no third-party code beside the write token.
  report:
    name: Report to issues
    needs: [decide, sweep]
    if: ${{ !cancelled() && needs.decide.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      # The newest artifact per leg of this run, unzipped to artifacts/<leg>/ (a rerun of a failed
      # leg uploads a second artifact under the same name, so the newest one stands).
      - name: Download the findings
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p artifacts
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | "\(.name) \(.created_at) \(.id)"' \
          | sort -k1,1 -k2,2r \
          | awk -v suffix="-${RUN_ID}" '
              substr($1, length($1) - length(suffix) + 1) != suffix { next }
              !seen[$1]++ { print $1, $3 }' \
          | while read -r name id; do
              leg="${name#dox-gates-}"; leg="${leg%-${RUN_ID}}"
              echo "${leg}: artifact ${id}"
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "artifacts/${leg}.zip"
              unzip -o -q "artifacts/${leg}.zip" -d "artifacts/${leg}"
              rm "artifacts/${leg}.zip"
            done

      - name: Open or update gate issues
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FINDING: ${{ inputs.force_finding }}
          # Every leg of the sweep job's matrix.
          LEGS: chromium-1,chromium-2,chromium-3,chromium-4,chromium-5,chromium-6,webkit-1,webkit-2,webkit-3,firefox-1,firefox-2,firefox-3
        run: |
          args=(--legs "$LEGS")
          if [ "$FORCE_FINDING" = "true" ]; then args+=(--dry-run-finding); fi
          shopt -s nullglob
          node apps/dox/scripts/gates/file-issues.mjs "${args[@]}" artifacts/*/summary.json
