name: Publish Package

# Publishing a GitHub Release *is* the publish button. `tag-on-version-change.yml`
# creates the tag `@northguild/<pkg>@<version>` and a matching draft release for
# every package bumped on main; a maintainer reviews that draft and hits Publish
# (or fills in the release form by hand against an existing tag), and this
# workflow takes it from there — validate, build, test, `npm publish`, announce.
#
# The package to publish is derived entirely from the release tag, so one
# workflow covers all four packages and there is nothing to pick from a dropdown.
on:
  release:
    types: [published]

# A publish must never be cancelled mid-flight.
concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # lets npm use OIDC trusted publishing when it's configured

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest
    environment: release
    if: github.event.release.draft == false
    env:
      # Job-level so the notify step can check whether the secret is configured
      # at all — an unset webhook shouldn't fail an otherwise successful publish.
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag, not main: publish exactly what was released, even if main
          # has moved on since the version bump landed. Fully qualified so a
          # branch that happens to share the tag's name can never win.
          ref: refs/tags/${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          # Deliberately no `cache: pnpm` here, unlike ci.yml. npm's release
          # guidance is to never restore a dependency cache in a build that
          # publishes — a poisoned cache entry would end up inside the tarball.
          # This job runs a handful of times a month; the cold install is cheap.

      - name: Resolve package from release tag
        id: resolve
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          case "$TAG" in
            @northguild/*@*) ;;
            *)
              echo "::error::Release tag '$TAG' is not a package tag. Expected @northguild/<pkg>@<version>. Nothing was published."
              exit 1 ;;
          esac

          NAME="${TAG%@*}"          # "@northguild/gmt@1.15.0" -> "@northguild/gmt"
          VERSION="${TAG##*@}"      # -> "1.15.0"
          DIR="${NAME#@northguild/}" # -> "gmt"

          if [ ! -f "packages/$DIR/package.json" ]; then
            echo "::error::Tag '$TAG' resolves to packages/$DIR, which does not exist."
            exit 1
          fi

          # Guards against a hand-written release form tagging a version that
          # was never actually bumped in the manifest.
          ACTUAL=$(node -p "require('./packages/$DIR/package.json').version")
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "::error::Tag '$TAG' claims $VERSION but packages/$DIR/package.json is at $ACTUAL."
            exit 1
          fi

          # Prereleases go out under `next` so they never become the default
          # install for `npm i @northguild/<pkg>`.
          if [ "$PRERELEASE" = "true" ]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi

          {
            echo "name=$NAME"
            echo "version=$VERSION"
            echo "dir=$DIR"
            echo "dist_tag=$DIST_TAG"
          } >> "$GITHUB_OUTPUT"

          echo "Publishing $NAME@$VERSION from packages/$DIR under dist-tag '$DIST_TAG'."

      - name: Approve pnpm build scripts
        run: pnpm approve-builds --all

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # gmt-biome and gmt-eslint have no build; --if-present makes this one step
      # work for all four packages.
      - name: Build
        env:
          NAME: ${{ steps.resolve.outputs.name }}
        run: pnpm --filter "$NAME" --if-present run build

      # Last gate before the tarball is irreversible. The full Node × timezone
      # matrix already ran on main in ci.yml; this re-runs the package's own
      # suite against the exact tagged tree.
      - name: Test
        env:
          NAME: ${{ steps.resolve.outputs.name }}
        run: pnpm --filter "$NAME" --if-present run test

      - name: Inspect tarball contents
        working-directory: packages/${{ steps.resolve.outputs.dir }}
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: packages/${{ steps.resolve.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag ${{ steps.resolve.outputs.dist_tag }}

      # Replaces the repo-level Discord webhook on `release` events: that one
      # fired on every release the moment it was published, including ones whose
      # npm publish then failed. This only announces what actually shipped.
      - name: Announce on Discord
        if: env.DISCORD_WEBHOOK != ''
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: |
            🚀 `${{ steps.resolve.outputs.name }}@${{ steps.resolve.outputs.version }}` is now live on npm under the `${{ steps.resolve.outputs.dist_tag }}` tag.
            📦 `pnpm add ${{ steps.resolve.outputs.name }}@${{ steps.resolve.outputs.version }}`
            📑 **What's New:** ${{ github.event.release.html_url }}
