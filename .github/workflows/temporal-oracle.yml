name: Temporal oracle

# Compares GMT's calendar results against Chromium's native Temporal (test262 is the final
# authority where they disagree) and reports which @js-temporal/polyfill workarounds are still
# needed. Manual and weekly only: never part of ci.yml, because "upstream still broken" must
# never fail a build. A failing oracle job means a GMT result differs from native Temporal on a
# row that the script's tag list does not explain — a GMT bug to fix.
#
# A final job (CORE-81) files issues from the verdicts the oracle job wrote: one per removable
# workaround, one `temporal-compat` issue for untagged mismatches, and one when the canary could not run.
# The dispatch inputs are dry runs: they file a clearly marked [dry run] issue and change no probe,
# tally or exit code.
#
# The native-suite job runs the whole packages/gmt suite on native Temporal in Node 26,
# Chromium, Firefox and WebKit, one matrix leg each. A failing leg means an untagged failure of either
# kind: a divergence (fails natively, passes on the polyfill in the same runtime) or a host
# failure (fails on both) that no host group covers. The report job files it as an issue.
# Each browser leg first runs the workaround probes of temporal-compat.mjs in that browser and
# writes a temporal-compat-<leg> verdict, so a workaround is called removable only when every
# engine in its scope agrees.

on:
  workflow_dispatch:
    inputs:
      force_removable:
        description: "Dry run: file a [dry run] issue as if this workaround (e.g. D2, D3+D4) were removable"
        type: string
        required: false
        default: ""
      force_mismatch:
        description: "Dry run: file a [dry run] issue for one synthetic untagged mismatch"
        type: boolean
        required: false
        default: false
      force_native_failure:
        description: "Dry run: file a [dry run] issue for one synthetic native-suite failure"
        type: boolean
        required: false
        default: false
  schedule:
    # Mondays 06:17 UTC
    - cron: "17 6 * * 1"

concurrency:
  group: temporal-oracle
  cancel-in-progress: false

permissions:
  contents: read

# The jobs name their Node with actions/setup-node, and that is the Node they must run.
# package.json pins a Node through devEngines.runtime for local work. In CI, every
# `pnpm install` passes --no-runtime so pnpm does not download that pin, and
# verifyDepsBeforeRun is off so a later `pnpm run` or `pnpm exec` does not quietly run an
# install without the flag and put the pinned Node ahead of the job's Node.
env:
  pnpm_config_verify_deps_before_run: "false"

jobs:
  oracle:
    name: Native Temporal oracle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Install Playwright Chromium
        run: pnpm --filter @gmt/dox exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Workaround canary
        id: compat
        run: pnpm compat

      - name: Native oracle
        id: oracle
        run: pnpm compat:oracle

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: temporal-oracle-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn

  native-suite:
    name: Native Temporal suite (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        leg: [node, chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Install Playwright ${{ matrix.leg }}
        if: matrix.leg != 'node'
        env:
          LEG: ${{ matrix.leg }}
        run: pnpm --filter @gmt/dox exec playwright install --with-deps "$LEG"

      - name: Build
        if: matrix.leg != 'node'
        run: pnpm --filter @northguild/gmt build

      - name: Native suite
        env:
          LEG: ${{ matrix.leg }}
        run: node scripts/native-suite.mjs "$LEG"

      - name: Job summary
        if: always()
        env:
          LEG: ${{ matrix.leg }}
        run: node scripts/native-suite.mjs summary "$LEG" >> "$GITHUB_STEP_SUMMARY"

      # The verdict goes in the artifact the report job downloads; the full pass reports
      # (tens of MB) go in a separate one, kept only for reading a failure by hand.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-suite-${{ matrix.leg }}-${{ github.run_id }}
          path: |
            artifacts/native-suite-*.json
            artifacts/temporal-compat-*.json
            !artifacts/native-suite-*.vitest.json
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-suite-${{ matrix.leg }}-reports
          path: artifacts/native-suite-*.vitest.json
          retention-days: 14
          if-no-files-found: ignore

  # Its own job so that the oracle job, which installs the whole workspace with build scripts
  # approved and runs Chromium, never holds a write token. This one runs only first-party Node and
  # `gh`. `actions: read` lets `gh` list and download the run's artifacts. `!cancelled()` runs it after a failed `oracle` job (the could-not-run case) and not after
  # a person cancels the run (GitHub Docs, "Contexts", status check functions).
  report:
    name: Report to issues
    needs: [oracle, native-suite]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      # Downloads the run's verdict artifacts by id, the newest per name. A rerun of the failed
      # jobs uploads a second artifact under the same name, and actions/download-artifact kept
      # whichever of the two it met first (#380). No artifact = no verdicts = a could-not-run issue.
      - name: Download verdicts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p artifacts
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | "\(.name) \(.created_at) \(.id)"' \
          | awk -v suffix="-${RUN_ID}" '
              substr($1, length($1) - length(suffix) + 1) == suffix {
                if (!($1 in created) || $2 > created[$1]) { created[$1] = $2; id[$1] = $3 }
              }
              END { for (name in created) print name, created[name], id[name] }' \
          | sort \
          | while read -r name created id; do
              echo "${name}: artifact ${id}, uploaded ${created}"
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "artifacts/${name}.zip"
              unzip -o -q "artifacts/${name}.zip" -d artifacts/
              rm "artifacts/${name}.zip"
            done

      - name: Open or update canary issues
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REMOVABLE: ${{ inputs.force_removable }}
          FORCE_MISMATCH: ${{ inputs.force_mismatch }}
          FORCE_NATIVE_FAILURE: ${{ inputs.force_native_failure }}
        run: |
          args=(temporal-oracle)
          if [ -n "$FORCE_REMOVABLE" ]; then args+=("--force-removable=$FORCE_REMOVABLE"); fi
          if [ "$FORCE_MISMATCH" = "true" ]; then args+=(--force-mismatch); fi
          if [ "$FORCE_NATIVE_FAILURE" = "true" ]; then args+=(--force-native-failure); fi
          node scripts/canary-report.mjs "${args[@]}"
