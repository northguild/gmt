name: US clock-change watch

# Pulse check: us-clock-watch
#
# Compares three sources with the snapshot: the Congress.gov API, with a GovInfo title search, and
# the Open States API for bills on the clock-change subject (new, or a changed latest action), and
# the IANA tz database for any change to the rules of a zone in apps/dox/src/lib/us-region-zones.json.
# The federal and state parts are carried from run to run: each run downloads the snapshot the last
# main run uploaded (the `us-clock-watch-carry` artifact), compares with it where it is newer than
# the committed scripts/us-clock-watch.snapshot.json, and uploads the parts it brought up to date.
# So each change is reported once and no one runs `refresh`. The tz part is always the committed
# one. Manual and weekly only: never
# part of ci.yml or `pnpm run validate`, because those runs have no network or keys. A difference
# opens or updates one `canary` issue per kind (federal, state, tz-us-zone); a source that cannot
# run (a network or HTTP error, a 429, a body that does not parse, a missing secret) opens or
# updates one could-not-run issue and the others still report. The tz issue is the signal to start
# CORE-90 phase 2. The federal and state issues ask for a review of the Proposals page: the canary
# edits nothing in the repo. The dispatch input is a dry run: it files a clearly marked [dry run]
# issue and changes no comparison or exit code. Issues are filed only from main: a run on another
# branch lists what it would have filed in the job summary and files nothing, and its carried
# snapshot is never read.

on:
  workflow_dispatch:
    inputs:
      force_difference:
        description: "Dry run: file a [dry run] issue for one synthetic federal difference"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 7 * * 1"

concurrency:
  group: us-clock-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canary:
    name: US clock-change sources
    runs-on: ubuntu-latest
    # The check stops itself at 45 minutes (LIMITS.checkDeadlineMs) and still files its issue.
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The script uses only Node built-ins and `fetch`: no install, no build.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      # The newest unexpired carried snapshot from a main run of this workflow, unzipped to
      # artifacts/carry/. With none (the first run, or 90 days without one), the check starts from
      # the committed snapshot. It holds no API key.
      - name: Download the carried snapshot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=us-clock-watch-carry&per_page=50" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")]
              | sort_by(.created_at) | last | .id // empty')
          if [ -z "$id" ]; then
            echo "No carried snapshot: comparing with the committed one."
            exit 0
          fi
          echo "carried snapshot: artifact ${id}"
          mkdir -p artifacts/carry
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > artifacts/carry.zip
          unzip -o -q artifacts/carry.zip -d artifacts/carry
          rm artifacts/carry.zip

      # The two API keys go to this step only. The script sends each one in a request header and
      # never prints it or a URL that holds it.
      - name: Compare with Congress.gov, Open States and the IANA tz database
        id: check
        env:
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
          OPEN_STATES_API_KEY: ${{ secrets.OPEN_STATES_API_KEY }}
        run: node scripts/us-clock-watch.mjs check --carry=artifacts/carry/us-clock-watch.snapshot.json

      # One job: it installs nothing and runs only first-party Node, `gh` and GitHub's own artifact
      # action, so there is no third-party code to keep away from the write token. `!cancelled()` runs this after the
      # comparison's exit 1 or 2, so the run fails and the issue opens. It holds no API key.
      - name: Open or update canary issues
        id: report
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_DIFFERENCE: ${{ inputs.force_difference }}
        run: |
          args=(us-clock-watch)
          if [ "$FORCE_DIFFERENCE" = "true" ]; then args+=(--force-us-clock-difference); fi
          node scripts/canary-report.mjs "${args[@]}"

      # Only once the issues are filed: a run whose report failed keeps the last carried snapshot,
      # so its changes are listed again next week rather than lost.
      - name: Upload the carried snapshot
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: us-clock-watch-carry
          path: artifacts/carry/us-clock-watch.snapshot.json
          if-no-files-found: warn
          retention-days: 90
