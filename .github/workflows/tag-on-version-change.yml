name: Tag On Version Change

# Every package in this repo is versioned independently by Changesets, so a
# single repo-wide `v1.2.3` tag is meaningless here. This workflow watches for
# the "Version Packages" commit landing on main and, for each package whose
# `version` actually moved, creates the Changesets-style tag
# `@northguild/<pkg>@<version>` — the exact naming every existing tag and
# GitHub Release already uses.
#
# It also opens a *draft* GitHub Release per new tag, with notes lifted from
# that package's CHANGELOG.md. Publishing that draft from the GitHub UI is what
# triggers `publish.yml` and ships the package to npm; nothing here publishes.
on:
  push:
    branches: [main]
    paths:
      - "packages/*/package.json"
  workflow_dispatch:

# Tag/release creation must never be cancelled halfway through a multi-package
# release, so unlike ci.yml this queues instead of cancelling.
concurrency:
  group: tag-on-version-change
  cancel-in-progress: false

permissions:
  contents: write # create and push tags, create draft releases

jobs:
  tag:
    name: Tag bumped packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full tag history for the "already tagged?" check

      - name: Create tags for bumped packages
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # On a push we diff each manifest against the previous commit. On
          # workflow_dispatch (or a first push / force-push, where `before` is
          # the null SHA or has been garbage-collected) there is nothing to diff
          # against, so we fall back to "tag every current version that has no
          # tag yet" — the tag-existence check below keeps that idempotent.
          BASE="$BEFORE"
          if [ "$EVENT_NAME" != "push" ] \
            || [ -z "$BASE" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=""
            echo "No usable base commit — tagging any untagged current version."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CREATED=()

          for MANIFEST in packages/*/package.json; do
            DIR=$(dirname "$MANIFEST")
            PKG=$(basename "$DIR")

            if [ "$(node -p "require('./$MANIFEST').private === true")" = "true" ]; then
              echo "skip $PKG — private, never published"
              continue
            fi

            NAME=$(node -p "require('./$MANIFEST').name")
            VERSION=$(node -p "require('./$MANIFEST').version")
            TAG="$NAME@$VERSION"

            if [ -n "$BASE" ]; then
              # A package added in this push has no previous manifest; the empty
              # PREV then falls through to the tag-existence check below.
              PREV=$(git show "$BASE:$MANIFEST" 2>/dev/null \
                | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{process.stdout.write(JSON.parse(d).version||"")}catch{}})' \
                || true)
              if [ "$PREV" = "$VERSION" ]; then
                echo "skip $PKG — version unchanged at $VERSION"
                continue
              fi
            fi

            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "skip $PKG — tag $TAG already exists"
              continue
            fi

            echo "tagging $TAG"
            git tag -a "$TAG" -m "Release $TAG"
            CREATED+=("$TAG")
          done

          if [ ${#CREATED[@]} -eq 0 ]; then
            echo "created=" >> "$GITHUB_OUTPUT"
            echo "No package versions changed — no tags created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git push origin "${CREATED[@]}"
          # Space-separated so the next step can iterate without needing JSON.
          echo "created=${CREATED[*]}" >> "$GITHUB_OUTPUT"

      - name: Open draft releases
        if: steps.tags.outputs.created != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CREATED: ${{ steps.tags.outputs.created }}
        run: |
          set -euo pipefail

          {
            echo "## Draft releases created"
            echo
            echo "Publish a draft from the Releases page to ship that package to npm."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for TAG in $CREATED; do
            PKG=${TAG%@*}            # "@northguild/gmt-oxlint@1.1.2" -> "@northguild/gmt-oxlint"
            PKG=${PKG#@northguild/}  # -> "gmt-oxlint"

            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "skip $TAG — release already exists"
              continue
            fi

            NOTES=$(mktemp)
            # Everything from the first "## <version>" heading up to the next
            # one, minus the heading itself — i.e. this release's entry only.
            if [ -f "packages/$PKG/CHANGELOG.md" ]; then
              awk '/^## /{f++} f==1' "packages/$PKG/CHANGELOG.md" | tail -n +2 > "$NOTES"
            fi
            if [ ! -s "$NOTES" ]; then
              echo "No CHANGELOG entry found for \`$TAG\`." > "$NOTES"
            fi

            # Only the headline package moves the repo's "Latest release" badge.
            if [ "$PKG" = "gmt" ]; then
              LATEST="--latest"
            else
              LATEST="--latest=false"
            fi

            # --verify-tag: never let gh auto-create a tag off main if the
            # push above somehow didn't land the ref we're naming here.
            URL=$(gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "$TAG" \
              --notes-file "$NOTES" \
              "$LATEST")
            echo "drafted $TAG -> $URL"
            echo "- [\`$TAG\`]($URL)" >> "$GITHUB_STEP_SUMMARY"
          done
