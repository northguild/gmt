name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

# The jobs name their Node with actions/setup-node, and that is the Node they must run.
# package.json pins a Node through devEngines.runtime for local work. In CI, every
# `pnpm install` passes --no-runtime so pnpm does not download that pin, and
# verifyDepsBeforeRun is off so a later `pnpm run` or `pnpm exec` does not quietly run an
# install without the flag and put the pinned Node ahead of the job's Node.
env:
  pnpm_config_verify_deps_before_run: "false"

jobs:
  determine-affected:
    name: Determine affected packages
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.detect.outputs.any_changed }}
      gmt_changed: ${{ steps.detect.outputs.gmt_changed }}
      non_gmt_changed: ${{ steps.detect.outputs.non_gmt_changed }}
      dox_changed: ${{ steps.detect.outputs.dox_changed }}
      base: ${{ steps.detect.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          else
            BASE="${{ github.event.before }}"
            # A force-push leaves `before` naming a commit the checkout does not have.
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            fi
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD_SHA")
          echo "changed files: $CHANGED"
          if echo "$CHANGED" | grep -q '^packages/gmt/'; then
            echo "gmt_changed=true" >> $GITHUB_OUTPUT
          else
            echo "gmt_changed=false" >> $GITHUB_OUTPUT
          fi
          # apps/** is deliberately classified as non-GMT: docs changes run the
          # build-lint matrix and the `tests` job, never the GMT TZ matrix.
          # Surfaced as its own output so DOX-A2's deploy workflow can gate on it.
          if echo "$CHANGED" | grep -q '^apps/dox/'; then
            echo "dox_changed=true" >> $GITHUB_OUTPUT
          else
            echo "dox_changed=false" >> $GITHUB_OUTPUT
          fi
          NON_GMT=$(echo "$CHANGED" | grep -v '^packages/gmt/' | grep -v '^packages/gmt-oxlint/' || true)
          if [ -z "$NON_GMT" ]; then
            echo "non_gmt_changed=false" >> $GITHUB_OUTPUT
          else
            echo "non_gmt_changed=true" >> $GITHUB_OUTPUT
          fi
          if [ -z "$CHANGED" ]; then
            echo "any_changed=false" >> $GITHUB_OUTPUT
          else
            echo "any_changed=true" >> $GITHUB_OUTPUT
          fi

  # John Conner termination of false attribution
  trailers:
    name: No machine trailers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: No commit or PR description names an AI co-author or session
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          PATTERN='^(co-authored-by:.*(claude|copilot|anthropic)|claude-session:)'
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            RANGE="origin/$BASE_REF..HEAD"
          else
            BASE="$BEFORE"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              BASE=$(git rev-parse HEAD~1)
            fi
            RANGE="$BASE..HEAD"
          fi
          FOUND=0
          for C in $(git rev-list "$RANGE"); do
            MSG=$(git log -1 --format=%B "$C")
            if grep -qiE "$PATTERN" <<< "$MSG"; then
              echo "::error::$(git log -1 --format='%h %s' "$C") carries a machine co-author or session trailer."
              FOUND=1
            fi
          done
          if grep -qiE "$PATTERN" <<< "${PR_BODY:-}"; then
            echo "::error::The PR description carries a machine co-author or session trailer, and a squash merge would copy it into main."
            FOUND=1
          fi
          exit "$FOUND"

  consistency:
    name: Story consistency
    runs-on: ubuntu-latest
    needs: determine-affected
    if: needs.determine-affected.outputs.any_changed == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      # Any advisory in the lockfile fails the job, at pnpm's default audit level. The katex
      # and undici overrides in pnpm-workspace.yaml are what keep this at zero today; each goes
      # dormant once nothing asks for a version below its fix.
      - name: No known vulnerabilities in dependencies
        run: pnpm audit

      # `validate` runs these, but only on pushes to main — by which point a drifting
      # tracker, a carried bug or a missing changeset has already merged. These are the
      # parts of it that are cheap enough to also gate every PR.
      - name: Tracker dependency columns are in sync
        run: node scripts/deps.mjs check

      # GMT ships zero known bugs (AGENTS.md Core Rule 12): no skipped, todo, focused or
      # expected-to-fail test, and no known-defect note, may merge.
      - name: No disabled tests or known-defect notes
        run: node scripts/test-markers.mjs check

      # apps/dox's tests import `@northguild/gmt/*` subpaths, which resolve to its `dist`,
      # so collecting them needs the package built first. `validate` gets this for free by
      # running the whole build ahead of `stats check`; this job builds just the one package.
      - name: Build @northguild/gmt
        run: pnpm --filter @northguild/gmt run build

      - name: Published figures match the repo
        run: node scripts/stats.mjs check

      - name: Upstream filing tracker matches the committed snapshot
        run: node scripts/upstream.mjs check

      # Three content pages are generated, not committed: `guides/concepts/dst-disambiguation.md`
      # (copied from the canonical `docs/dst-disambiguation.md`), `scenarios/index.mdx` and
      # `tools/index.mdx`. Other pages and both READMEs link to them, so without this step
      # `api-surface` reports those links as broken and this job fails on a checkout that is
      # perfectly fine. All three generators read tracked sources, so CI produces byte-identical
      # pages to a local run.
      - name: Generate the dox content pages that are not committed
        run: |
          node apps/dox/scripts/build-guides.mjs
          node apps/dox/scripts/build-scenario-index.mjs
          pnpm --filter dox exec tsx scripts/build-tool-index.ts
          pnpm --filter dox exec tsx scripts/build-industry-pages.ts

      - name: Public API surface — reachability, examples, doc imports and links
        run: node scripts/api-surface.mjs check

      - name: Bundle size budgets
        run: node scripts/bundle-size.mjs check

      # `llms.test.ts`'s three text-surface gates all early-return when `apps/dox/dist` is absent,
      # and the Tests job never builds the site — it is a separate runner that builds only
      # `@northguild/gmt`. So those gates had never run in CI, which is how a raw `<UpstreamDefects />`
      # reached every text surface with the suite green (CORE-8 review, #253). Built here, once,
      # rather than in the Node matrix, because one runner is enough to check generated output.
      - name: Build the dox site
        run: pnpm --filter dox run build

      # DOX_DIST_REQUIRED turns those gates' "no dist, nothing to check" skip into a failure, but
      # only here, where the step above guarantees a build. Keyed to `CI` it would fire in the
      # Tests job too, which runs the same suite on three Node versions and does not build the site.
      # `dist-base.test.ts` reads the same build for the /gmt base: a root URL without `/gmt` in any
      # HTML, CSS, script, `.md`, `llms*.txt`, sitemap or `_redirects` fails here.
      - name: "Built site: text surfaces and the /gmt base"
        env:
          DOX_DIST_REQUIRED: "1"
        run: pnpm --filter dox exec vitest run scripts/llms.test.ts scripts/dist-base.test.ts

      # A release PR (`changeset:version` already run) deletes the changesets it consumed
      # and bumps versions instead of adding a new one — that's the point of it, per
      # PUBLISHING.md step 3. `changeset status` can't tell the difference and fails any
      # such PR, so detect it here instead of gating on it.
      # A Renovate PR that changes only dependencies that never ship (devDependencies, or any
      # dependency of a private package such as apps/dox) releases nothing, so it needs no changeset.
      # Any other package change on a Renovate branch still does; a person adds it to the PR.
      - name: A changeset covers every changed package
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          BASE="origin/${{ github.base_ref }}"
          DELETED_CHANGESETS=$(git diff --name-status "$BASE"...HEAD -- '.changeset/*.md' | grep -c '^D' || true)
          VERSION_BUMPED=$(git diff "$BASE"...HEAD -- '**/package.json' | grep -c '^+.*"version":' || true)
          if [ "$DELETED_CHANGESETS" -gt 0 ] && [ "$VERSION_BUMPED" -gt 0 ]; then
            echo "Release PR: changesets were consumed by changeset:version — skipping."
          elif [[ "$HEAD_REF" == renovate/* ]] && node scripts/unshipped-deps.mjs "$BASE"; then
            echo "Renovate PR: only dependencies that never ship change — skipping."
          else
            pnpm exec changeset status --since="$BASE"
          fi

  # The Dox browser gates on the pages the PR changed, in Chromium. Advisory: it is not a required
  # check until the owner makes it one. `main` is covered by the nightly sweep, not by this job.
  # `--against` is the merge base `determine-affected` computes, so both see the same diff.
  dox-gates:
    name: Dox gates (changed pages, Chromium)
    runs-on: ubuntu-latest
    needs: determine-affected
    if: github.event_name == 'pull_request' && needs.determine-affected.outputs.dox_changed == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Fetch the base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @gmt/dox exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium
        run: pnpm --filter @gmt/dox exec playwright install --with-deps chromium

      # The runner prints one screen to the log and appends it to the job summary.
      - name: Gates on the changed pages
        run: >
          pnpm --filter dox gates --tier pr --browsers chromium --themes dark,light
          --against "origin/${{ github.base_ref }}"

      - name: Upload the gate logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dox-gates-${{ github.run_id }}
          path: |
            apps/dox/.gates/
            !apps/dox/.gates/vite-cache/
          retention-days: 14

  build-lint:
    name: Build & Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: determine-affected
    if: needs.determine-affected.outputs.any_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: pnpm

      - name: Node and tzdata this job runs
        run: node -p "process.version+' tz '+process.versions.tz"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      # The matrix names a Node, and pnpm must run that one, not the Node that
      # devEngines.runtime pins for local work. This fails the job if they differ.
      - name: pnpm runs the matrix Node
        env:
          WANT: ${{ matrix.node-version }}
        run: |
          echo "pnpm exec node: v$(pnpm exec node -p process.versions.node), tz $(pnpm exec node -p process.versions.tz)"
          test "$(pnpm exec node -p 'process.versions.node.split(".")[0]')" = "$WANT"

      - name: Clean stale build artifacts
        run: find . -name "*.tsbuildinfo" -delete 2>/dev/null || true

      # Lets the `tests` job (which needs a built @northguild/gmt to resolve
      # its dist-only exports) reuse this build instead of rebuilding gmt itself.
      - name: Cache @northguild/gmt dist
        uses: actions/cache@v6
        with:
          path: packages/gmt/dist
          key: gmt-dist-${{ matrix.node-version }}-${{ hashFiles('packages/gmt/src/**', 'packages/gmt/tsconfig*.json', 'packages/gmt/tsdown.config.ts', 'packages/gmt/package.json', 'pnpm-lock.yaml') }}

      - name: Build, lint, typecheck
        run: |
          pnpm -r --if-present run build
          pnpm -r --if-present run lint
          pnpm -r --if-present run typecheck

  tests:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [determine-affected, build-lint]
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if non-GMT changed
        id: check-non-gmt
        run: |
          if [ "${{ needs.determine-affected.outputs.non_gmt_changed }}" = "false" ]; then
            echo "run_tests=false" >> $GITHUB_OUTPUT
          else
            echo "run_tests=true" >> $GITHUB_OUTPUT
          fi

      - name: No non-GMT changes, skip tests
        if: steps.check-non-gmt.outputs.run_tests == 'false'
        run: echo "Skipping tests - no non-GMT package changes detected"

      - uses: pnpm/action-setup@v6
        if: steps.check-non-gmt.outputs.run_tests == 'true'

      - uses: actions/setup-node@v7
        if: steps.check-non-gmt.outputs.run_tests == 'true'
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: pnpm

      - name: Node and tzdata this job runs
        if: steps.check-non-gmt.outputs.run_tests == 'true'
        run: node -p "process.version+' tz '+process.versions.tz"

      - name: Install dependencies
        if: steps.check-non-gmt.outputs.run_tests == 'true'
        run: pnpm install --frozen-lockfile --no-runtime

      # The matrix names a Node, and pnpm must run that one, not the Node that
      # devEngines.runtime pins for local work. This fails the job if they differ.
      - name: pnpm runs the matrix Node
        if: steps.check-non-gmt.outputs.run_tests == 'true'
        env:
          WANT: ${{ matrix.node-version }}
        run: |
          echo "pnpm exec node: v$(pnpm exec node -p process.versions.node), tz $(pnpm exec node -p process.versions.tz)"
          test "$(pnpm exec node -p 'process.versions.node.split(".")[0]')" = "$WANT"

      # Restores the dist built (and cached) by build-lint for this same
      # node version/gmt-source hash, so we skip rebuilding it here.
      - name: Cache @northguild/gmt dist
        id: cache-gmt-dist
        if: steps.check-non-gmt.outputs.run_tests == 'true'
        uses: actions/cache@v6
        with:
          path: packages/gmt/dist
          key: gmt-dist-${{ matrix.node-version }}-${{ hashFiles('packages/gmt/src/**', 'packages/gmt/tsconfig*.json', 'packages/gmt/tsdown.config.ts', 'packages/gmt/package.json', 'pnpm-lock.yaml') }}

      - name: Build @northguild/gmt
        if: steps.check-non-gmt.outputs.run_tests == 'true' && steps.cache-gmt-dist.outputs.cache-hit != 'true'
        run: pnpm --filter @northguild/gmt run build

      # Mirrors the old path-based gating for non-gmt packages.
      # gmt has its own TZ matrix (gmt-matrix job); gmt-oxlint is excluded as before.
      # `!root` keeps the root `vitest run` (which globs the gmt suite) out of this job.
      - name: Run tests (excluding gmt, gmt-oxlint)
        if: steps.check-non-gmt.outputs.run_tests == 'true'
        run: pnpm --filter='!root' --filter='!@northguild/gmt' --filter='!@northguild/gmt-oxlint' -r --if-present run test

      - name: Collect test artifacts
        if: steps.check-non-gmt.outputs.run_tests == 'true' && always()
        run: |
          mkdir -p artifact || true
          # Covers apps/ as well as packages/ so DOX-A3a's future docs:test
          # artifacts are not silently dropped.
          for base in packages apps; do
            [ -d "$base" ] || continue
            find "$base" -maxdepth 2 -type d -name 'test-results' -exec cp -r {} artifact/ \; || true
            find "$base" -maxdepth 2 -type f -name 'vitest-junit.xml' -exec cp {} artifact/ \; || true
            find "$base" -maxdepth 2 -type d -name 'coverage' -exec cp -r {} artifact/ \; || true
          done

      - uses: actions/upload-artifact@v7
        if: steps.check-non-gmt.outputs.run_tests == 'true' && always()
        with:
          name: test-artifacts-${{ matrix.node-version }}
          path: artifact

  gmt-matrix:
    name: GMT TZ Tests — Node ${{ matrix.node-version }} / ${{ matrix.timezone }}
    runs-on: ubuntu-latest
    needs: determine-affected
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
        timezone:
          [
            "Pacific/Niue",
            "America/New_York",
            "UTC",
            "Europe/London",
            "Asia/Kolkata",
            "Asia/Kathmandu",
            "Asia/Shanghai",
            "Australia/Lord_Howe",
            "Pacific/Chatham",
            "Pacific/Apia",
          ]
    timeout-minutes: 120
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if GMT changed
        id: check-gmt
        run: |
          if [ "${{ needs.determine-affected.outputs.gmt_changed }}" = "false" ]; then
            echo "gmt_changed=false" >> $GITHUB_OUTPUT
          else
            echo "gmt_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: No GMT changes, skip tests
        if: steps.check-gmt.outputs.gmt_changed == 'false'
        run: echo "Skipping GMT TZ tests - no gmt package changes detected"

      - uses: pnpm/action-setup@v6
        if: steps.check-gmt.outputs.gmt_changed == 'true'

      - uses: actions/setup-node@v7
        if: steps.check-gmt.outputs.gmt_changed == 'true'
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: pnpm

      - name: Node and tzdata this job runs
        if: steps.check-gmt.outputs.gmt_changed == 'true'
        run: node -p "process.version+' tz '+process.versions.tz"

      - name: Install dependencies
        if: steps.check-gmt.outputs.gmt_changed == 'true'
        run: pnpm install --frozen-lockfile --no-runtime

      # The matrix names a Node, and pnpm must run that one, not the Node that
      # devEngines.runtime pins for local work. This fails the job if they differ.
      - name: pnpm runs the matrix Node
        if: steps.check-gmt.outputs.gmt_changed == 'true'
        env:
          WANT: ${{ matrix.node-version }}
        run: |
          echo "pnpm exec node: v$(pnpm exec node -p process.versions.node), tz $(pnpm exec node -p process.versions.tz)"
          test "$(pnpm exec node -p 'process.versions.node.split(".")[0]')" = "$WANT"

      - name: Run GMT tests
        if: steps.check-gmt.outputs.gmt_changed == 'true'
        run: pnpm -w exec vitest run --config packages/gmt/vitest.config.ts

      - name: Collect GMT test artifacts
        if: steps.check-gmt.outputs.gmt_changed == 'true' && always()
        run: |
          mkdir -p artifact || true
          if [ -d packages/gmt/test-results ]; then cp -r packages/gmt/test-results artifact/ || true; fi
          if [ -f packages/gmt/vitest-junit.xml ]; then cp packages/gmt/vitest-junit.xml artifact/ || true; fi
          if [ -d packages/gmt/coverage ]; then cp -r packages/gmt/coverage artifact/ || true; fi

      - uses: actions/upload-artifact@v7
        if: steps.check-gmt.outputs.gmt_changed == 'true' && always()
        with:
          name: gmt-artifacts-${{ matrix.node-version }}-${{ matrix.timezone }}
          path: artifact
